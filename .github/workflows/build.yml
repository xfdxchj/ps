name: Build Desktop + Android

# 《破碎的像素地牢：终焉扩展》 skeleton CI.
# Builds a runnable desktop distribution AND an Android APK on GitHub runners,
# then uploads both as workflow artifacts.
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable (fix Commit-everything lost the +x bit)
        run: chmod +x gradlew

      # Cache gradle downloads so rebuilds are fast
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Write local.properties (Android SDK path)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      # Signatures/licences & SDK components; then compile everything
      - name: Accept Android licenses & install platforms
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      # 1) Desktop: compile + create a runnable distribution in :desktop/build/install
      #    (this is the headless-safe build gate; launching the window needs a display)
      - name: Build desktop (compile + distribution)
        run: ./gradlew :desktop:compileJava :desktop:installDist --no-daemon --console=plain
        shell: bash

      - name: Build Android APK (debug, installable)
        run: ./gradlew :android:assembleDebug --no-daemon --console=plain
        shell: bash

      - name: Upload desktop artifact (runnable distribution)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: desktop/build/install/desktop

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/build/outputs/apk/debug/*.apk
