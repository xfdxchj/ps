#==== 1 牢地碎破 ====
challenges.shattered_land=牢地碎破
challenges.shattered_land_desc=地牢的区域被打乱了。\n- **区域倒置**：1 区刷 5 区的怪、2 区刷 4 区、4 区刷 2 区、5 区刷 1 区（3 区不变）\n- 所有怪物的生命/伤害/护甲/命中/闪避按专用配置表重新配平\n- 5 区出现的原 1 区怪物额外获得移速提升与永久祝福\n- 与「极强」联动

#==== 40 / 65 / 104 ====
challenges.loan=贷款
challenges.loan_desc=向商人借钱。\n- 在商店里可以贷款金币\n- 必须在 1000 回合内偿还本金的 110%\n- 到期自动从金币里扣除，金币不够则欠着\n- 同一时间只能欠一笔

challenges.timely_rain=及时雨
challenges.timely_rain_desc=命不该绝。\n- 整局**第一次**致命伤害不会死，保留 1 点生命\n- 触发顺序在「命悬一线」之前

challenges.close_call=命悬一线
challenges.close_call_desc=生死一线间。\n- 致命伤害时有 13% 概率保留 1 点生命\n- 可重复触发\n- 与「及时雨」联动：及时雨先用掉那次必保

