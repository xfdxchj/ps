challenges.no_food=缩餐节食
challenges.no_food_desc=食物本就稀缺，但你还需要注意节食！\n\n-使用各类食物与丰饶之角的饱腹效果为原本的三分之一\n-其他恢复饥饿的机制不受影响
challenges.no_armor=信念护体
challenges.no_armor_desc=如今护甲已难堪大用，你只能相信你自己的肉身了！\n\n-布甲之外所有护甲的基本防御力降低\n-所有护甲升级提供的防御力成长大幅降低\n-灵壤守卫的防御力大幅降低
challenges.no_healing=恐药异症
challenges.no_healing_desc=治疗药剂真是种好东西，可惜你对它过敏！\n\n-治疗药剂、以治疗药剂为原料炼制的道具与阳光果将无法治愈英雄，反而会使英雄中毒\n-紊乱魔药不会随机到治愈英雄或使英雄中毒的效果\n-这些道具对其他单位依然发挥正常效果。
challenges.no_herbalism=荒芜之地
challenges.no_herbalism_desc=这个晦气的地牢里连干净的水都没有了...\n\n-移除露珠\n-移除所有特殊植物\n-高草依然会掉落种子，但种子不会生根发芽
challenges.swarm_intelligence=集群智能
challenges.swarm_intelligence_desc=要小心了，地牢里的怪物们也在学习进步！\n\n-当你被敌人发现时，附近的其他敌人也会被吸引到那里。
challenges.darkness=没入黑暗
challenges.darkness_desc=地牢毕竟是在地下嘛！\n\n-正常视野范围显著缩小\n-每层都会出现一根火把\n-其他光源有效性降至1/5
challenges.no_scrolls=禁忌咒文
challenges.no_scrolls_desc=一种卷轴会变得更稀有。不幸的是，总是最有用的那一种。\n\n-移除地牢中半数的升级卷轴
challenges.champion_enemies=精英强敌
challenges.champion_enemies_desc=道高一尺，魔高一丈！\n\n普通敌人生成时会有概率获得特殊的精英强敌效果，概率会从1层的1/8增长至21层的1/6。\n\n-精英强敌不以沉睡状态生成\n-精英强敌生成时英雄会察觉\n-精英强敌无法被转化为盟友\n\n一共有六种精英强敌效果：\n_烈焰(橙)：_近战伤害+25%，攻击时点燃，死亡时起火(不点燃水体)\n_索敌(紫)：_近战伤害+25%，近战范围+3\n_敌法(绿)：_所受伤害-50%，免疫魔法效果\n_巨型(蓝)：_所受伤害-80%，近战范围+1，无法进入门道\n_天佑(黄)：_精准、闪避x4\n_成长(红)：_精准、闪避、攻击伤害与有效生命+20%，每4回合以上属性成长1%
challenges.stronger_bosses=绝命头目
challenges.stronger_bosses_desc=这项挑战会让所有Boss都更具挑战性！\n\n_粘咕：_生命值+20%\n_-_持续处于水中时，生命回复量递增，最高至每回合3点\n_-_爆发攻击蓄力时间由2回合缩短至1回合\n_天狗：_生命+25%\n_-_第一阶段：陷阱更加致命\n_-_第二阶段：技能频率更高\n_DM-300：_生命+33%\n_-_能量塔更坚固，并且需要击毁3座\n_-_技能频率更高，威力也更强大\n_-_超载时移动速度更高\n_-_地表导线数量为原先的两倍\n_矮人国王：_生命+50%\n_-_所有阶段中都会召唤更多强力随从\n_-_第一阶段：更高的技能与召唤频率\n_-_第二阶段：每轮额外召唤两名随从\n_-_第三阶段：生命值+100%，进一步提高召唤频率\n_Yog-Dzewa：_\n_-_同时召唤两个古神之拳！\n_-_激光攻击伤害+60%\n_-_召唤更强大的随从

rankings$record.something=在黑暗中被击杀
rankings$record.won=获得Yendor护符
rankings$record.ascended=成功携带护符回到地面！
#END 便利测试挑战
challenges.convenience=便利测试包
challenges.convenience_desc=每局开局携带一小份测试便利包（金币、几颗宝石、若干杖），便于快速体验商店宝石、镶嵌与法杖蜕变。\n- 给予几颗宝石\n- 给予少量金币与示例法杖
challenges.costly_alchemy=炼金无望
challenges.costly_alchemy_desc=炼金的消耗更大了。\n- 在炼金台合成需 1.5x 炼金能量
challenges.inflation=通货膨胀
challenges.inflation_desc=市场物价陷入混乱。\n- 商店售价 +50%\n- 把东西卖给商店：所得 -50%

challenges.berserk=狂暴
challenges.berserk_desc=怪物被打疼了会更凶。\n- 怪物受击后攻击力 +20%\n- 持续 2 回合，不叠加

challenges.fragile=脆弱
challenges.fragile_desc=谁都扛不住打。\n- 玩家与怪物受到的伤害都提高 13%

challenges.glass_cannon=玻璃大炮
challenges.glass_cannon_desc=攻强守弱。\n- 玩家攻击 +20%\n- 玩家生命上限 -13%

challenges.elite_boost=精英强化
challenges.elite_boost_desc=精英怪更强了。\n- 精英怪的生命上限、伤害、命中、闪避各 +20%\n- 勾选本项即会让精英怪出现，无需再勾"精英强敌"

challenges.elite_dungeon=精英地牢
challenges.elite_dungeon_desc=这地牢里混进了不少稀有品种。\n- 13% 的怪物被替换为其**稀有变种**\n- 稀有变种包括：白化老鼠、流亡豺狼人、寄居蟹、腐蚀史莱姆、强盗、幽灵死灵法师、装甲暴徒、DM-201、资深武僧、混沌元素、酸蚀蝎\n- 稀有怪通常属性更强或掉落更好（白化老鼠必掉物品）

challenges.growing_fury=越战越勇
challenges.growing_fury_desc=怪物越残血越拼命。\n- 每损失 20% 生命，攻击 +10%\n- 最多叠加 4 层（上限 +40%）

challenges.last_stand=破釜沉舟
challenges.last_stand_desc=残血时爆发。\n- 玩家生命低于 30% 时：攻击 +30%、攻速 +20%

challenges.all_out=极致攻哈
challenges.all_out_desc=双方都全力输出。\n- 玩家与怪物的攻击各 +20%

challenges.wrath_of_dead=亡者之怒
challenges.wrath_of_dead_desc=濒死反扑。\n- 玩家生命低于 10% 时，造成的伤害翻倍

#==== 音频类挑战的台词（ChallengeSfx 用）====
endcontent.challenge.challengesfx.minister_line=首先，我是生活部部长
endcontent.challenge.challengesfx.future_line=王同学，我祝你前～程～似锦
endcontent.challenge.challengesfx.oligei_line=奥利给！
endcontent.challenge.challengesfx.nailong_line=奶龙大笑！
endcontent.challenge.challengesfx.haozihao_line=耗子尾汁！

#==== 音频类挑战（第二批）====
challenges.life_minister=生活部长
challenges.life_minister_desc=部长要来视察了。\n- 每回合 3% 概率停止行动，说出"首先，我是生活部部长"

challenges.bright_future=前程似锦
challenges.bright_future_desc=来自王同学的祝福。\n- 每回合 3% 概率停止行动，说出"王同学，我祝你前～程～似锦"

challenges.rat_tail_soup=耗子尾汁
challenges.rat_tail_soup_desc=年轻人不讲武德。\n- 每回合 3% 概率显示"耗子尾汁"并播放音效

challenges.oligei=奥利给
challenges.oligei_desc=干了兄弟们！\n- 每回合 3% 概率停止行动，喊"奥利给"\n- 同时获得 1 回合狂暴

challenges.providence=天意侵蚀
challenges.providence_desc=天意难测。\n- 每回合 13% 概率随机播放一段新三国音效

challenges.milk_dragon=奶龙大笑
challenges.milk_dragon_desc=每回合 3% 概率触发奶龙大笑

challenges.grimm_music=格林之音
challenges.grimm_music_desc=将全部常规区域与 Boss 战的 BGM 替换为格林（黑魂）主题。\n- 纯娱乐规则，不影响战斗平衡\n- 启用后，其他概率触发音效的规则仍可勾选，但其音效会被 BGM 盖过

#==== 生成数量 / 掉落类挑战（第三批）====
challenges.crowded=人口密集
challenges.crowded_desc=怪物变多了。\n- 普通怪物生成数量 +20%\n- 与"怪物浪潮"可叠加（最多 x4.8）

challenges.monster_wave=怪物浪潮
challenges.monster_wave_desc=数量压倒质量。\n- 怪物生成数量 x4\n- 普通怪物的生命与伤害变为原来的 20%\n- Boss 不受数值削弱

challenges.abundance=丰饶
challenges.abundance_desc=资源充足。\n- 资源及物品掉落 +25%

challenges.barren=贫瘠
challenges.barren_desc=资源匮乏。\n- 资源及物品掉落 -25%\n- 不会降到 0，通关所需的最少资源仍有保障

challenges.scarce_supplies=稀缺补给
challenges.scarce_supplies_desc=补给变少了。\n- 消耗品（药水 / 卷轴 / 食物 / 炸弹）生成数量 -40%

challenges.excess_supplies=过量补给
challenges.excess_supplies_desc=补给过剩。\n- 消耗品（药水 / 卷轴 / 食物 / 炸弹）生成数量 +50%

challenges.bomb_fanatic=炸弹狂魔
challenges.bomb_fanatic_desc=每到一层都想炸点什么。\n- 每层额外掉落 1 个炸弹

challenges.frieren=芙莉莲
challenges.frieren_desc=宝箱似乎变多了。\n- 宝箱数量提高约 20%

challenges.treasure_hunter=宝物猎人
challenges.treasure_hunter_desc=盯着箱子，别管那些小怪。\n- 普通怪物掉落 -30%\n- 每个宝箱额外增加 1 件物品

#==== 经济类挑战（第四批）====
challenges.bounty=赏金制度
challenges.bounty_desc=悬赏取酬。\n- 击杀精英怪额外获得 30 金币\n- 击杀 Boss 额外获得 120 金币

challenges.high_buyback=高价回收
challenges.high_buyback_desc=商人出价更公道了。\n- 把物品卖给商店所得 x1.5\n- 与"通货膨胀"互斥

challenges.destitute=一贫如洗
challenges.destitute_desc=每到一个新区域都要被盘剥一次。\n- 进入下一区域时金币 -20%

challenges.generous_merchant=慷慨商人
challenges.generous_merchant_desc=货物更全，但价格也更贵。\n- 商店商品数量 +30%\n- 商店售价 x1.25\n- 与"通货膨胀"可共存（价格会更高）

#==== ChallengeEffects 运行时提示 ====
endcontent.challenge.challengeeffects.destitute_lost=一贫如洗：进入新区域，损失 %d 金币
endcontent.challenge.challengeeffects.immovable_block=免疫

#==== 战斗 / 环境触发类挑战（第五批）====
challenges.frenzy=狂热
challenges.frenzy_desc=怪物越打越快。\n- 怪物每次攻击命中后攻速 +13%\n- 最多叠加 3 层（上限 +39%），持续 5 回合

challenges.popeye=大力水手
challenges.popeye_desc=力大但迟钝。\n- 玩家近战物理攻击 +25%\n- 玩家攻击速度 -20%

challenges.swift=风驰电掣
challenges.swift_desc=大家都变快了。\n- 玩家攻速 +20%\n- 怪物移速 +20%

challenges.bloodbath=血流成河
challenges.bloodbath_desc=刀刀见血。\n- 任何攻击命中后 13% 概率使目标流血\n- 玩家与怪物都适用

challenges.retaliation=以牙还牙
challenges.retaliation_desc=怪物会还手。\n- 玩家攻击后，怪物 13% 概率立即反击\n- 每回合每只怪最多反击一次，不消耗怪物回合

challenges.immovable=不动如山
challenges.immovable_desc=偶尔完全打不动。\n- 怪物受击时 13% 概率完全免疫该次伤害

challenges.immolation=烈火焚身
challenges.immolation_desc=挨打就着火。\n- 玩家受击时 13% 概率燃烧

challenges.frozen_world=冰天雪地
challenges.frozen_world_desc=天寒地冻。\n- 玩家每回合 13% 概率寒冷、2% 概率冰冻\n- 只影响玩家

challenges.thunderstorm=雷暴
challenges.thunderstorm_desc=天雷无眼。\n- 每回合 5% 概率闪电随机劈中一个角色（玩家或怪物）\n- 伤害 = 3 x 层数 / 5（第 25 层约 15 点），并可能点燃

challenges.college_student=大学生
challenges.college_student_desc=熬夜的代价。\n- 玩家每回合 3% 概率受到 1 点伤害\n- 不会致死（生命值至少保留 1）

challenges.giant=巨型化
challenges.giant_desc=有些怪长得特别大。\n- 13% 的怪物生命值 +50%、体型增大\n- 不影响寻路（仍能通过门道）\n- Boss 与小 Boss 不参与

challenges.flower_lover=我爱花花
challenges.flower_lover_desc=地牢里开满了花。\n- 13% 的草地被替换为随机植物\n- 纯趣味规则，不影响数值

challenges.absurd_world=荒诞世界
challenges.absurd_world_desc=你看到的不一定是真的。\n- 怪物贴图随机变化\n- 纯外观规则，属性与 AI 完全不变

#==== 扩展包易档（139-168 中的易档）====
challenges.holy_possession=神圣附体
challenges.holy_possession_desc=神恩加身。\n- 经验获取 +20%

challenges.enlightenment=醍醐灌顶
challenges.enlightenment_desc=一点就通。\n- 每个天赋层级额外获得 1 点天赋点\n- 与神圣灵感药水可叠加\n- 与"就业紧张"互斥

challenges.job_crisis=就业紧张
challenges.job_crisis_desc=英雄也得面对现实。\n- 职业天赋全部失效（所有天赋加成一并无效）\n- 与"醍醐灌顶"互斥

challenges.heirloom_ring=家传戒指
challenges.heirloom_ring_desc=祖传的宝贝。\n- 开局额外获得一枚神射戒指（已鉴定）

challenges.heirloom_armor=家传铠甲
challenges.heirloom_armor_desc=祖传的护具。\n- 开局额外获得一件板甲（已鉴定）

challenges.holy_light=神圣之光
challenges.holy_light_desc=微光护佑。\n- 每回合 13% 概率回复 2% 最大生命\n- 满血时不触发

#==== 准易档（18/22/69/121/140）+ 134 归入格林 ====
challenges.aging=老龄化
challenges.aging_desc=怪物也上了年纪。\n- 普通怪物每回合 13% 概率睡眠 1 回合\n- Boss 与精英怪免疫

challenges.overkill_reverse=物极必反
challenges.overkill_reverse_desc=打得太狠反而没用。\n- 单次伤害超过目标最大生命 150% 时，该次伤害被完全免疫\n- 只对怪物生效

challenges.nine_to_one=九九归一
challenges.nine_to_one_desc=九是极数。\n- 最终伤害为 9 的倍数时，改为 1 点\n- 玩家与怪物都适用

challenges.medieval_knight=中世纪骑士
challenges.medieval_knight_desc=重甲在身，步履维艰。\n- 玩家护甲值 +60%\n- 玩家移动速度 -50%\n- 与「信念护体」互斥

challenges.headshot=枪枪爆头
challenges.headshot_desc=拉开距离，一枪一个。\n- 与目标距离 5 格以上时，远程攻击伤害必定为最大值\n- 距离小于 5 格时正常结算

challenges.golden_mead=黄金蜂蜜酒
challenges.golden_mead_desc=格林系列物品。使用后获得「发狂」：\n- 攻击提升 50%\n- 每回合扣除最大生命值的一半（最低保留 1）\n- 与「镇魂歌」联动

#==== 60/79/17（准易档第二批）====
challenges.valentine=情人节
challenges.valentine_desc=今天是个好日子。\n- 玩家攻击命中后，13% 概率魅惑目标\n- 被魅惑的怪物会暂时停止敌对行为

challenges.heirloom_wand=家传法杖
challenges.heirloom_wand_desc=祖传的施法工具。\n- 开局额外获得 13 种进阶法杖中随机的一支（已鉴定）\n- 与「家传戒指」「家传铠甲」可同时勾选

challenges.advanced_enchant=高级附魔台
challenges.advanced_enchant_desc=每到新区域都有补给。\n- 每进入一个新区域（每 5 层）获得 1 个附魔秘卷\n- Boss 层不额外发放

endcontent.challenge.challengeeffects.enchant_region_gain=高级附魔台：获得 %d 个附魔秘卷

#==== 7 / 57 / 59 ====
challenges.skip_student=跳级生
challenges.skip_student_desc=越级而上的代价与收益。\n- 开局获得一张**跳级券**\n- 使用后直接前往下一区域的第一层\n- 跳级时获得 +2 力量、+3 升级卷轴、+4 经验药水\n- 用一次少一张

challenges.broken_equipment=残缺装备
challenges.broken_equipment_desc=有些装备天生就差一截。\n- 随机附魔时 13% 概率获得「残缺」词缀\n- 残缺装备攻击力降低 20%\n- 残缺装备无法进行装备觉醒

challenges.cursed_equipment=诅咒装备
challenges.cursed_equipment_desc=不祥的气息更浓了。\n- 装备获得诅咒的概率提高 13%\n- 原本 30%，提高后为 43%

#==== 55 / 58 ====
challenges.unstable_upgrade=不稳定强化
challenges.unstable_upgrade_desc=强化结果飘忽不定。\n- 使用升级卷轴强化时，13% 概率额外 +2 级\n- 其余情况按正常结算

challenges.random_enchant=随机附魔
challenges.random_enchant_desc=到手的装备常常带着点什么。\n- 装备（武器/护甲）获得时 50% 概率带随机附魔词缀\n- 与「装备觉醒」独立计算，可叠加

endcontent.challenge.challengeeffects.unstable_upgrade=不稳定强化：额外 +%d 级！

#==== 46 / 71 ====
challenges.unstable_potions=药剂不稳定
challenges.unstable_potions_desc=药水的效果不太对劲。\n- 饮用药水后 13% 概率追加一个随机效果\n- 效果正负各半：急速 / 隐形 / 护盾 或 中毒 / 燃烧 / 眩晕

challenges.drunk=喝大了
challenges.drunk_desc=喝断片了。\n- 每回合 3% 概率触发眩晕 3 回合

endcontent.challenge.challengeeffects.unstable_potion_haste=药剂不稳定：你突然感到身轻如燕！
endcontent.challenge.challengeeffects.unstable_potion_invisible=药剂不稳定：你的身影淡了下去。
endcontent.challenge.challengeeffects.unstable_potion_barrier=药剂不稳定：一层护盾笼罩了你。
endcontent.challenge.challengeeffects.unstable_potion_poison=药剂不稳定：你感到一阵恶心……
endcontent.challenge.challengeeffects.unstable_potion_burning=药剂不稳定：你身上着火了！
endcontent.challenge.challengeeffects.unstable_potion_paralysed=药剂不稳定：你的身体不听使唤了。
endcontent.challenge.challengeeffects.drunk_stun=你喝大了，眼前一黑。

#==== 环境类 49/52/74/141/149/162 ====
challenges.chernobyl=切尔诺贝利
challenges.chernobyl_desc=空气本身就是毒。\n- 全图铺满毒气，玩家受影响、怪物免疫\n- 开局与每层额外获得 1 瓶净化药水\n- 与「恐药异症」联动

challenges.trap_overflow=陷阱泛滥
challenges.trap_overflow_desc=地上到处都是机关。\n- 地图陷阱数量翻倍

challenges.rainforest=热带雨林
challenges.rainforest_desc=水里不太平。\n- 每一格水有 13% 概率生成食人鱼

challenges.anti_magic_zone=禁魔空间
challenges.anti_magic_zone_desc=魔法在这里被压制。\n- 所有魔法伤害降低 20%\n- 玩家与怪物都受影响\n- 与「紊乱法杖」「法术连击」「家传法杖」互斥

challenges.sticky_honey=黏糊蜂蜜
challenges.sticky_honey_desc=地牢里到处是蜂蜜。\n- 每一层额外刷新 2 只蜜蜂

challenges.realistic_dungeon=真实地牢
challenges.realistic_dungeon_desc=越深，空气越稀薄。\n- 每 50−5×(层数÷5) 回合必须停下深呼吸一次\n- 第 5 层约 45 回合，第 25 层约 25 回合\n- 最低不低于 15 回合

endcontent.challenge.challengeeffects.breath_stop=空气太稀薄了，你不得不停下来深呼吸。

#==== 159 绵羊地牢 ====
challenges.sheep_dungeon=绵羊地牢
challenges.sheep_dungeon_desc=咩咩咩。\n- 玩家周围 7×7 范围内 13% 概率生成 1~2 只绵羊\n- 触发后有 20 回合冷却\n- 绵羊无敌且不会攻击，会自行消失

#==== 49 切尔诺贝利：药水改动 ====
challenges.chernobyl.purity=净化药水（切尔诺贝利）：解除中毒，300 回合内不再中毒
