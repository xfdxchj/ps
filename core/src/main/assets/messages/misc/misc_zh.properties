challenges.no_food=缩餐节食
challenges.no_food_desc=食物本就稀缺，但你还需要注意节食！\n\n-使用各类食物与丰饶之角的饱腹效果为原本的三分之一\n-其他恢复饥饿的机制不受影响
challenges.no_armor=信念护体
challenges.no_armor_desc=如今护甲已难堪大用，你只能相信你自己的肉身了！\n\n-布甲之外所有护甲的基本防御力降低\n-所有护甲升级提供的防御力成长大幅降低\n-灵壤守卫的防御力大幅降低
challenges.no_healing=恐药异症
challenges.no_healing_desc=治疗药剂真是种好东西，可惜你对它过敏！\n\n-治疗药剂、以治疗药剂为原料炼制的道具与阳光果将无法治愈英雄，反而会使英雄中毒\n-紊乱魔药不会随机到治愈英雄或使英雄中毒的效果\n-这些道具对其他单位依然发挥正常效果。
challenges.no_herbalism=荒芜之地
challenges.no_herbalism_desc=这个晦气的地牢里连干净的水都没有了...\n\n-移除露珠\n-移除所有特殊植物\n-高草依然会掉落种子，但种子不会生根发芽
challenges.swarm_intelligence=集群智能
challenges.swarm_intelligence_desc=要小心了，地牢里的怪物们也在学习进步！\n\n-当你被敌人发现时，附近的其他敌人也会被吸引到那里。
challenges.darkness=没入黑暗
challenges.darkness_desc=地牢毕竟是在地下嘛！\n\n-正常视野范围显著缩小\n-每层都会出现一根火把\n-其他光源有效性降至1/5
challenges.no_scrolls=禁忌咒文
challenges.no_scrolls_desc=一种卷轴会变得更稀有。不幸的是，总是最有用的那一种。\n\n-移除地牢中半数的升级卷轴
challenges.champion_enemies=精英强敌
challenges.champion_enemies_desc=道高一尺，魔高一丈！\n\n普通敌人生成时会有概率获得特殊的精英强敌效果，概率会从1层的1/8增长至21层的1/6。\n\n-精英强敌不以沉睡状态生成\n-精英强敌生成时英雄会察觉\n-精英强敌无法被转化为盟友\n\n一共有六种精英强敌效果：\n_烈焰(橙)：_近战伤害+25%，攻击时点燃，死亡时起火(不点燃水体)\n_索敌(紫)：_近战伤害+25%，近战范围+3\n_敌法(绿)：_所受伤害-50%，免疫魔法效果\n_巨型(蓝)：_所受伤害-80%，近战范围+1，无法进入门道\n_天佑(黄)：_精准、闪避x4\n_成长(红)：_精准、闪避、攻击伤害与有效生命+20%，每4回合以上属性成长1%
challenges.stronger_bosses=绝命头目
challenges.stronger_bosses_desc=这项挑战会让所有Boss都更具挑战性！\n\n_粘咕：_生命值+20%\n_-_持续处于水中时，生命回复量递增，最高至每回合3点\n_-_爆发攻击蓄力时间由2回合缩短至1回合\n_天狗：_生命+25%\n_-_第一阶段：陷阱更加致命\n_-_第二阶段：技能频率更高\n_DM-300：_生命+33%\n_-_能量塔更坚固，并且需要击毁3座\n_-_技能频率更高，威力也更强大\n_-_超载时移动速度更高\n_-_地表导线数量为原先的两倍\n_矮人国王：_生命+50%\n_-_所有阶段中都会召唤更多强力随从\n_-_第一阶段：更高的技能与召唤频率\n_-_第二阶段：每轮额外召唤两名随从\n_-_第三阶段：生命值+100%，进一步提高召唤频率\n_Yog-Dzewa：_\n_-_同时召唤两个古神之拳！\n_-_激光攻击伤害+60%\n_-_召唤更强大的随从

rankings$record.something=在黑暗中被击杀
rankings$record.won=获得Yendor护符
rankings$record.ascended=成功携带护符回到地面！
#END 便利测试挑战
challenges.convenience=便利测试包
challenges.convenience_desc=为了省事，你带了一小包东西上路。\n\n-开局获得金币、几颗宝石与若干法杖\n-便于快速体验商店宝石、镶嵌与法杖蜕变\n-仅供测试与快速体验
challenges.costly_alchemy=炼金无望
challenges.costly_alchemy_desc=炼金台也知道现在是什么行情。\n\n-在炼金台合成需 1.5 倍炼金能量
challenges.inflation=通货膨胀
challenges.inflation_desc=市场物价陷入混乱，钱不值钱了。\n\n-商店售价 +50%\n-把东西卖给商店所得 -50%

challenges.berserk=狂暴
challenges.berserk_desc=受了伤的家伙反而更凶。\n\n-怪物受击后攻击力提高 20%\n-持续 2 回合，不叠加

challenges.fragile=脆弱
challenges.fragile_desc=这里的一切都比看上去更脆。\n\n-玩家与怪物受到的伤害都提高 13%

challenges.glass_cannon=玻璃大炮
challenges.glass_cannon_desc=你放弃了保护自己，换来了纯粹的破坏力。\n\n-玩家攻击提高 20%\n-生命上限降低 13%

challenges.elite_boost=精英强化
challenges.elite_boost_desc=地牢里混进了不少稀有品种。\n\n-精英怪的生命上限、伤害、命中、闪避各提高 20%\n-本项会让精英怪出现，无需其它挑战配合

challenges.elite_dungeon=精英地牢
challenges.elite_dungeon_desc=地牢里混进了不少稀有品种。\n\n-13% 的怪物被替换为其稀有变种\n-包括白化老鼠、寄居蟹、强盗等

challenges.growing_fury=越战越勇
challenges.growing_fury_desc=伤得越重，它打得越狠。\n\n-怪物每损失 20% 生命，攻击力提高 10%\n-最多叠加 4 层（上限 +40%）

challenges.last_stand=破釜沉舟
challenges.last_stand_desc=退路已经没有了，只剩下往前冲。\n\n-玩家生命低于 30% 时，攻击提高 30%、攻速提高 20%

challenges.all_out=极致攻哈
challenges.all_out_desc=谁都不留手了。\n\n-玩家与怪物的攻击各提高 20%

challenges.wrath_of_dead=亡者之怒
challenges.wrath_of_dead_desc=当你半只脚踏进坟墓，反而打出了这辈子最重的一击。\n\n-玩家生命低于 10% 时，造成的伤害翻倍

#==== 音频类挑战的台词（ChallengeSfx 用）====
endcontent.challenge.challengesfx.minister_line=首先，我是生活部部长
endcontent.challenge.challengesfx.future_line=王同学，我祝你前～程～似锦
endcontent.challenge.challengesfx.oligei_line=奥利给！
endcontent.challenge.challengesfx.nailong_line=奶龙大笑！
endcontent.challenge.challengesfx.haozihao_line=耗子尾汁！

#==== 音频类挑战（第二批）====
challenges.life_minister=生活部长
challenges.life_minister_desc=这一层住着一位很有主见的人。\n\n-每回合有 3% 概率停止行动\n-他会说出「首先，我是生活部部长」

challenges.bright_future=前程似锦
challenges.bright_future_desc=有人在为你送上祝福，虽然方式有点奇怪。\n\n-每回合有 3% 概率停止行动\n-他会说出「王同学，我祝你前～程～似锦」

challenges.rat_tail_soup=耗子尾汁
challenges.rat_tail_soup_desc=年轻人，我劝你耗子尾汁。\n\n-每回合有 3% 概率显示「耗子尾汁」\n-同时播放一段随机音效

challenges.oligei=奥利给
challenges.oligei_desc=有时候，你需要的只是一声呐喊。\n\n-每回合有 1% 概率停止行动\n-大喊「奥利给」，获得 1 回合狂暴

challenges.providence=天意侵蚀
challenges.providence_desc=有什么东西在干扰这一层的"天意"。\n\n-每回合有 13% 概率随机播放一段新三国音效

challenges.milk_dragon=奶龙大笑
challenges.milk_dragon_desc=空气里飘来一阵笑声，笑得毫无理由。\n\n-每回合有 3% 概率触发奶龙大笑音效

challenges.grimm_music=格林之音
challenges.grimm_music_desc=这一层响起了不属于这里的音乐。\n\n-将所有常规区域与 Boss 战 BGM 替换为格林主题\n-纯娱乐规则，不影响战斗平衡

#==== 生成数量 / 掉落类挑战（第三批）====
challenges.crowded=人口密集
challenges.crowded_desc=这一层挤得有点过分了。\n\n-普通怪物生成数量提高 20%\n-与「怪物浪潮」可叠加

challenges.monster_wave=怪物浪潮
challenges.monster_wave_desc=它们来得又快又多，但每一只都虚弱得多。\n\n-怪物生成数量变为 4 倍\n-普通怪物的生命与伤害变为原来的 20%\n-Boss 不削弱

challenges.abundance=丰饶
challenges.abundance_desc=这一趟地牢似乎格外慷慨。\n\n-资源及物品掉落增加 25%

challenges.barren=贫瘠
challenges.barren_desc=这一趟地牢似乎格外吝啬。\n\n-资源及物品掉落减少 25%\n-不会降到 0，保证通关所需的最少资源

challenges.scarce_supplies=稀缺补给
challenges.scarce_supplies_desc=消耗品在这一层格外少见。\n\n-药水、卷轴、食物、炸弹的生成数量减少 40%

challenges.excess_supplies=过量补给
challenges.excess_supplies_desc=消耗品在这一层堆得到处都是。\n\n-药水、卷轴、食物、炸弹的生成数量增加 50%

challenges.bomb_fanatic=炸弹狂魔
challenges.bomb_fanatic_desc=这一层好像有人刻意留下了礼物。\n\n-每层额外掉落 1 个炸弹

challenges.frieren=芙莉莲
challenges.frieren_desc=收集魔法的人，总能在意想不到的地方找到宝箱。\n\n-宝箱数量提高约 20%

challenges.treasure_hunter=宝物猎人
challenges.treasure_hunter_desc=怪物身上没什么值钱的，好东西都在箱子里。\n\n-普通怪物掉落减少 30%\n-每个宝箱额外增加 1 件物品

#==== 经济类挑战（第四批）====
challenges.bounty=赏金制度
challenges.bounty_desc=有人愿意为某些头颅付钱。\n\n-击杀精英怪额外获得 30 金币\n-击杀 Boss 额外获得 120 金币

challenges.high_buyback=高价回收
challenges.high_buyback_desc=商人今天心情不错。\n\n-把物品卖给商店所得变为 1.5 倍

challenges.destitute=一贫如洗
challenges.destitute_desc=每次往深处走，口袋就轻一点。\n\n-每次进入新区域（每 5 层）时，金币减少 20%

challenges.generous_merchant=慷慨商人
challenges.generous_merchant_desc=这位商人进货进得有点多，价格也涨了一点。\n\n-商店商品数量 +30%\n-商店售价 ×1.25\n-与「通货膨胀」可共存

#==== ChallengeEffects 运行时提示 ====
endcontent.challenge.challengeeffects.destitute_lost=一贫如洗：进入新区域，损失 %d 金币
endcontent.challenge.challengeeffects.immovable_block=免疫

#==== 战斗 / 环境触发类挑战（第五批）====
challenges.frenzy=狂热
challenges.frenzy_desc=它们越打越兴奋，手也越来越快。\n\n-怪物每次成功攻击后攻速 +13%\n-最多叠加 3 层（上限 +39%），持续 5 回合

challenges.popeye=大力水手
challenges.popeye_desc=你力气大得惊人，但挥拳的间隔也长了。\n\n-玩家近战物理攻击 +25%\n-攻击速度 -20%

challenges.swift=风驰电掣
challenges.swift_desc=你更快了，但它们也是。\n\n-玩家攻速 +20%\n-怪物移速 +20%

challenges.bloodbath=血流成河
challenges.bloodbath_desc=伤口总比看上去更深。\n\n-任何攻击命中后有 13% 概率使目标流血

challenges.retaliation=以牙还牙
challenges.retaliation_desc=你打它一下，它立刻还你一下。\n\n-玩家攻击后，怪物有 13% 概率立即反击\n-每回合每只怪最多一次，不消耗怪物回合

challenges.immovable=不动如山
challenges.immovable_desc=有时候刀砍上去就像砍在石头上。\n\n-怪物受击时有 13% 概率完全免疫该次伤害

challenges.immolation=烈火焚身
challenges.immolation_desc=挨打的瞬间，你身上着了起来。\n\n-玩家受击时有 13% 概率燃烧

challenges.frozen_world=冰天雪地
challenges.frozen_world_desc=哈出的气都能结成霜。\n\n-玩家每回合有 1% 概率寒冷、1% 概率冰冻

challenges.thunderstorm=雷暴
challenges.thunderstorm_desc=头顶的云一直在响。\n\n-每回合有 5% 概率闪电随机劈中一个角色\n-伤害 = 3 × 层数 ÷ 5\n-被劈中可能点燃

challenges.college_student=大学生
challenges.college_student_desc=熬夜赶作业的后果就是随时可能倒下。\n\n-玩家每回合有 3% 概率受到 1 点伤害\n-不会致死，生命值至少保留 1

challenges.giant=巨型化
challenges.giant_desc=有些东西长得比同类大得多，也更难打死。\n\n-13% 的怪物生命值提高 50%\n-体型同步增大（不影响寻路）

challenges.flower_lover=我爱花花
challenges.flower_lover_desc=不知道谁在这里撒了一把种子。\n\n-13% 的草地被替换为随机植物\n-纯趣味，不影响数值

challenges.absurd_world=荒诞世界
challenges.absurd_world_desc=你看到的不一定是真的。\n\n-怪物贴图随机变化\n-纯外观，不影响属性与 AI

#==== 扩展包易档（139-168 中的易档）====
challenges.holy_possession=神圣附体
challenges.holy_possession_desc=有什么东西在指引你。\n\n-经验获取增加 20%

challenges.enlightenment=醍醐灌顶
challenges.enlightenment_desc=有些道理，你在开口之前就已经懂了。\n\n-每个天赋层级额外获得 1 点天赋点\n-与神圣灵感药水可叠加

challenges.job_crisis=就业紧张
challenges.job_crisis_desc=你学的东西在这里一点用都没有。\n\n-职业天赋全部失效\n-所有天赋加成一并无效

challenges.heirloom_ring=家传戒指
challenges.heirloom_ring_desc=家里传下来的东西，虽然没人记得是谁传的。\n\n-开局额外获得一枚神射戒指\n-已鉴定

challenges.heirloom_armor=家传铠甲
challenges.heirloom_armor_desc=家里传下来的东西，虽然没人记得是谁传的。\n\n-开局额外获得一件板甲\n-已鉴定

challenges.holy_light=神圣之光
challenges.holy_light_desc=有一束光照在你身上，伤口在慢慢合上。\n\n-每回合有 13% 概率回复 2% 最大生命\n-满血时不触发

#==== 准易档（18/22/69/121/140）+ 134 归入格林 ====
challenges.aging=老龄化
challenges.aging_desc=它们打着打着就困了。\n\n-普通怪物每回合有 13% 概率睡眠 1 回合\n-Boss 与精英怪免疫

challenges.overkill_reverse=物极必反
challenges.overkill_reverse_desc=力太大了反而打不实。\n\n-单次伤害超过目标最大生命 150% 时，该次伤害被完全免疫\n-只对怪物生效

challenges.nine_to_one=九九归一
challenges.nine_to_one_desc=命运偶尔会对数字较真。\n\n-最终伤害为 9 的倍数时，改为 1 点

challenges.medieval_knight=中世纪骑士
challenges.medieval_knight_desc=你被裹在厚厚的铁壳里，走得很慢，但也很难被砍穿。\n\n-玩家护甲值 +60%\n-移动速度 -50%

challenges.headshot=枪枪爆头
challenges.headshot_desc=距离越远，你越能看清该打哪里。\n\n-玩家与目标距离 5 格以上时，远程攻击伤害必定为最大值

challenges.golden_mead=黄金蜂蜜酒
challenges.golden_mead_desc=金色的酒液在杯里晃，喝下去之后你就停不下来了。\n\n-使用后获得发狂\n-攻击力 +50%\n-每回合扣除最大生命的一半，最低保留 1 点\n-与镇魂歌联动

#==== 60/79/17（准易档第二批）====
challenges.valentine=情人节
challenges.valentine_desc=你的攻击带着某种让人脸红的东西。\n\n-玩家攻击命中后有 13% 概率魅惑目标

challenges.heirloom_wand=家传法杖
challenges.heirloom_wand_desc=家里传下来的东西，虽然没人记得是谁传的。\n\n-开局额外获得 13 种进阶法杖中随机的一支\n-已鉴定

challenges.advanced_enchant=高级附魔台
challenges.advanced_enchant_desc=每走完一段路，就能多学一点附魔的手艺。\n\n-每进入一个新区域（每 5 层）获得 1 个附魔秘卷

endcontent.challenge.challengeeffects.enchant_region_gain=高级附魔台：获得 %d 个附魔秘卷

#==== 7 / 57 / 59 ====
challenges.skip_student=跳级生
challenges.skip_student_desc=有人替你铺好了前面的路，代价是少走的那几步也没了收获。\n\n-开局获得一张跳级券\n-使用后直接前往下一区域的第一层\n-同时获得 +2 力量、+3 升级卷轴、+4 力量药水

challenges.broken_equipment=残缺装备
challenges.broken_equipment_desc=有些东西做出来就是次品。\n\n-随机附魔时有 13% 概率获得「残缺」词缀\n-残缺装备攻击力降低 20%\n-残缺装备不能进行装备觉醒

challenges.cursed_equipment=诅咒装备
challenges.cursed_equipment_desc=这些装备上沾着不太干净的东西。\n\n-装备获得诅咒的概率从 30% 提高到 43%

#==== 55 / 58 ====
challenges.unstable_upgrade=不稳定强化
challenges.unstable_upgrade_desc=运气好的时候，一张卷轴能顶两张用。\n\n-使用升级卷轴强化时有 13% 概率额外 +2 级

challenges.random_enchant=随机附魔
challenges.random_enchant_desc=谁也不知道这把刀上刻着什么。\n\n-装备获得时有 50% 概率带随机附魔词缀\n-与装备觉醒独立计算

endcontent.challenge.challengeeffects.unstable_upgrade=不稳定强化：额外 +%d 级！

#==== 46 / 71 ====
challenges.unstable_potions=药剂不稳定
challenges.unstable_potions_desc=你永远不知道这一口下去会发生什么。\n\n-饮用药水后有 13% 概率追加一个随机效果\n-效果正负各半

challenges.drunk=喝大了
challenges.drunk_desc=你喝多了，眼前的东西开始转。\n\n-每回合有 3% 概率触发眩晕 3 回合

endcontent.challenge.challengeeffects.unstable_potion_haste=药剂不稳定：你突然感到身轻如燕！
endcontent.challenge.challengeeffects.unstable_potion_invisible=药剂不稳定：你的身影淡了下去。
endcontent.challenge.challengeeffects.unstable_potion_barrier=药剂不稳定：一层护盾笼罩了你。
endcontent.challenge.challengeeffects.unstable_potion_poison=药剂不稳定：你感到一阵恶心……
endcontent.challenge.challengeeffects.unstable_potion_burning=药剂不稳定：你身上着火了！
endcontent.challenge.challengeeffects.unstable_potion_paralysed=药剂不稳定：你的身体不听使唤了。
endcontent.challenge.challengeeffects.drunk_stun=你喝大了，眼前一黑。

#==== 环境类 49/52/74/141/149/162 ====
challenges.chernobyl=切尔诺贝利
challenges.chernobyl_desc=空气里有股金属味，吸久了会从里面烂出来。\n\n-全图铺满毒气，玩家受影响\n-怪物免疫毒气\n-开局与每层额外获得净化药水

challenges.trap_overflow=陷阱泛滥
challenges.trap_overflow_desc=这一层的地板，最好每一步都先看清楚。\n\n-地图陷阱数量翻倍

challenges.rainforest=热带雨林
challenges.rainforest_desc=水面上偶尔会翻起一圈涟漪。\n\n-水中有 13% 概率生成食人鱼

challenges.anti_magic_zone=禁魔空间
challenges.anti_magic_zone_desc=这里连魔法都打不实。\n\n-所有魔法伤害降低 20%\n-玩家与怪物都受影响

challenges.sticky_honey=黏糊蜂蜜
challenges.sticky_honey_desc=空气里飘着甜腻的味道，嗡嗡声从没停过。\n\n-每一层额外刷新 2 只蜜蜂

challenges.realistic_dungeon=真实地牢
challenges.realistic_dungeon_desc=这里的空气比别处稀薄，你得时不时停下来喘一口。\n\n-每 50 - 5×(层数÷5) 回合必须停下深呼吸一次\n-层数越深，间隔越短

endcontent.challenge.challengeeffects.breath_stop=空气太稀薄了，你不得不停下来深呼吸。

#==== 159 绵羊地牢 ====
challenges.sheep_dungeon=绵羊地牢
challenges.sheep_dungeon_desc=你走着走着，旁边就多了一只。\n\n-玩家周围 7x7 范围内有 13% 概率生成 1~2 只绵羊\n-触发后有 20 回合冷却

#==== 49 切尔诺贝利：药水改动 ====
challenges.chernobyl.purity=净化药水（切尔诺贝利）：解除中毒，300 回合内不再中毒
challenges.chernobyl.cleanse=全面净化（切尔诺贝利）：清除所有负面效果，持续 600 回合

#==== 1 牢地碎破 ====
challenges.shattered_land=牢地碎破
challenges.shattered_land_desc=这个地牢的层数彻底乱了套，连它自己都记不清哪层是哪层。\n\n-越往下走，遇到的怪物反而越弱；越往上走，怪物反而越强\n-所有怪物的数值都按专用配置表重新调整过

#==== 40 / 65 / 104 ====
challenges.loan=贷款
challenges.loan_desc=钱可以先借着，利息以后再说。\n\n-可在商店贷款金币，金额 100/300/500/1000 自选\n-1000 回合内需偿还本金的 110%\n-同一时间只能欠一笔

challenges.timely_rain=及时雨
challenges.timely_rain_desc=命不该绝。\n\n-整局第一次致命伤害不会死\n-保留 1 点生命\n-触发顺序在「命悬一线」之前

challenges.close_call=命悬一线
challenges.close_call_desc=你不敢看自己伤得多重。\n\n-生命不显示数值，只显示状态描述\n-致命伤害时有 13% 概率保留 1 点生命

endcontent.challenge.challengeeffects.close_call_survive=命悬一线！你活了下来。

#==== 104 血量状态描述 ====
endcontent.challenge.challengeeffects.hp_perfect=精神抖擞
endcontent.challenge.challengeeffects.hp_good=状态尚可
endcontent.challenge.challengeeffects.hp_hurt=受了些伤
endcontent.challenge.challengeeffects.hp_bad=伤势不轻
endcontent.challenge.challengeeffects.hp_severe=伤得很重
endcontent.challenge.challengeeffects.hp_critical=命悬一线
endcontent.challenge.challengeeffects.hp_brink=只剩一口气

#==== 81 搏杀赌徒 ====
challenges.gambler=搏杀赌徒
challenges.gambler_desc=升级全靠运气，而运气也是实力的一部分。\n\n-开局获得 +3 财富戒指\n-财富戒指有 8% 概率产出升级卷轴\n-常规的升级卷轴投放被完全取消

#==== 本批新增 8 条 ====
challenges.thief_rats=盗贼鼠群
challenges.thief_rats_desc=它们不只是咬你，还顺手摸你的口袋。\n\n-怪物攻击命中时有 5% 概率偷走你 5% 的金币\n-击杀该怪物后双倍返还

challenges.no_lower_limit=无下限术士
challenges.no_lower_limit_desc=有些东西就是不怕远程。\n\n-怪物受到远程攻击时有 13% 概率完全免疫该次伤害

challenges.i_am_king=吾为王者
challenges.i_am_king_desc=坐在王座上的家伙，躲得比谁都稳。\n\n-所有 Boss 的命中与闪避提升 20%

challenges.flying_thief=飞天神偷
challenges.flying_thief_desc=有些家伙你几乎看不见。\n\n-13% 的怪物获得永久隐身\n-Boss 除外

challenges.demon_dungeon=恶魔地牢
challenges.demon_dungeon_desc=这里的居民被打上了某种记号。\n\n-所有怪物被视为恶魔类\n-只改属性标记，不改外观与数值

challenges.holy_power=神圣之力
challenges.holy_power_desc=神圣的力量对某些东西格外有效。\n\n-对恶魔类目标造成的伤害提升 30%\n-与「恶魔地牢」联动时收益最大化

challenges.ancient_upgrade=古代升级
challenges.ancient_upgrade_desc=古老的力量随着你的成长慢慢苏醒。\n\n-玩家每达到 3 级，伤害的下限与上限各提升 10%

challenges.monster_dungeon=怪物地牢
challenges.monster_dungeon_desc=这里的一切都和怪物有关，而且都比平时更频繁。\n\n-所有与怪物相关的概率规则提升至至少 25%

endcontent.challenge.challengeeffects.thief_rats_stolen=盗贼鼠群：它偷走了你 %d 金币！
endcontent.challenge.challengeeffects.thief_rats_refund=你把钱夺了回来，还多得了 %d 金币。
endcontent.challenge.challengeeffects.no_lower_limit_immune=无下限术士：它完全无视了这次远程攻击。

#==== 56 / 108 ====

challenges.awakening=装备觉醒
challenges.awakening_desc=用得久了，武器会记住你的手法。\n\n-武器击杀 50 只怪、或护甲格挡 100 次后觉醒\n-觉醒后获得一条随机附魔词缀\n-每件装备只能觉醒一次\n-残缺与诅咒装备不能觉醒

endcontent.challenge.challengeeffects.awakening_done=你的装备觉醒了！它获得了一条新的附魔词缀。

#==== 157 附魔扩充 ====
challenges.enchant_expansion=附魔扩充
challenges.enchant_expansion_desc=附魔的种类比平时多一些。\n\n-附魔池新增两条\n-锋利：近战伤害 +20%\n-力量：远程伤害 +20%

#==== 附魔名称 ====
items.weapon.enchantments.keen.name=锋利
items.weapon.enchantments.keen.desc=近战攻击伤害提升 20%。
items.weapon.enchantments.mighty.name=力量
items.weapon.enchantments.mighty.desc=远程攻击伤害提升 20%。

#==== 地图类 3/4/5/6/150/154 ====
challenges.region_shift=区域错位
challenges.region_shift_desc=区域的边界模糊了，一个地方会长出另一个地方的东西。\n\n-每个区域会混入相邻区域的生成内容

challenges.elite_migration=精英迁徙
challenges.elite_migration_desc=那些原本守在自己地盘上的家伙，现在到处乱走。\n\n-取消精英怪的楼层限制\n-精英怪在任何楼层都可能出现

challenges.monster_invasion=怪物入侵
challenges.monster_invasion_desc=每层都有些不请自来的客人。\n\n-每层额外混入 2 只其它区域的普通怪

challenges.full_dungeon=完整地牢
challenges.full_dungeon_desc=这趟旅程还长着呢。\n\n-每个区域的常规层由 4 层增至 9 层\n-Boss 层不变\n-主线从 25 层加长到 50 层

challenges.flooded_dungeon=淹没地牢
challenges.flooded_dungeon_desc=水从四面八方涌进来，这里已经没有一块干地了。\n\n-每一层都是水域生态\n-水中会生成幻影食人鱼

challenges.abandoned_dungeon=废弃地牢
challenges.abandoned_dungeon_desc=草木遮住了所有的路，脚下的每一寸都在等着缠住你。\n\n-每一层都是草木生态\n-踩踏植物时有概率被缠绕 3 回合


#==== 格林系列 125/133/136 ====
challenges.grimm_weapon=格林之器
challenges.grimm_weapon_desc=一位穿黑甲的骑士留下的东西，虽然他已经不在了。\n\n-开局获得银色短铳：出手不消耗回合，冷却 10\n-开局获得兔子怀表：可把短铳冷却归零，自身冷却 10\n-武器改为和 5 阶武器一样在关卡中刷新

challenges.grimm_weapon_2=格林之器2
challenges.grimm_weapon_2_desc=一对由神使遗落的双剑，挥动时会自行加速。\n\n-开局获得神天使双剑\n-每攻击一次命中数 +1，最多 7 次\n-每次造成 60% 伤害，必定命中\n-切换楼层后清零

challenges.grimm_weapon_3=格林之器3
challenges.grimm_weapon_3_desc=一把刻满怨念，一把流转着祝福。\n\n-开局获得怨恨之剑：生命越低伤害越高，1 血时跃升 3 倍\n-开局获得勇剑：三段循环，3 连击 / 必中 / 4 连击

#==== 格林装备名称 ====
items.silvergun.name=银色短铳
items.rabbitwatch.name=兔子的怀表
items.hatesword.name=怨恨之剑
items.bravesword.name=勇剑
items.angelsword.name=神天使双剑

#==== 129 心爱的少女 ====
challenges.beloved_girl=心爱的少女
challenges.beloved_girl_desc=有人在童话的残页里等你。\n\n-每 2 层刷新一枚童话残片，共 9 种，对应九位少女\n-3 枚不同残片炼成 1 张残页\n-3 张残页炼成《心爱的少女》

#==== 127 / 128 / 134 ====
challenges.grimm_ring=格林之戒
challenges.grimm_ring_desc=一枚黑铁戒指，内侧刻着一只兔子。\n\n-增加戒指黑兔戒指\n-每回合第一次命中后返还一个回合（一回合可攻击两次）\n-无法升级

challenges.grimm_art=格林之术
challenges.grimm_art_desc=一首写给死者的歌，唱的时候你暂时不在名单上。\n\n-增加道具镇魂歌\n-使用后获得 3 回合不死，生命到 0 也不会死\n-状态结束时若已欠下死亡，仍会死去

endcontent.grimm.goldenmead.ac_drink=饮用
endcontent.grimm.soulrequiem.ac_use=使用

#==== 131 格林之敌 ====
challenges.grimm_enemy=格林之敌
challenges.grimm_enemy_desc=坐在王座上的那个人换了。\n\n-将最终 Boss 古神替换为莉耶芙\n-贴图、名字、战斗对话、图鉴介绍全部替换\n-纯外观与文本，不影响数值

#==== 999 层 / 爱丽丝领域 ====
levels.alicerealm.region_name=爱丽丝领域
endcontent.grimm.alice.return=书页合上了。
endcontent.grimm.alice.ring=爱丽丝把一枚黑色的戒指放进了你手里。
endcontent.grimm.alice.ring_dupe=你已经有那枚戒指了。爱丽丝把它化作了一点别的东西。
endcontent.grimm.belovedgirl.teleport=书页翻动的声音。你被带往了某个不该存在的地方。

#==== 132 黑暗之魂 ====
challenges.dark_soul=黑暗之魂
challenges.dark_soul_desc=所有线索最终指向同一个地方。\n\n-古神护符替换为「爱丽丝」\n-贴图、名字、说明文本全部替换，它其实是一本书\n-需要 125~131 全部勾选才生效

#==== 126 格林之心 ====
challenges.grimm_heart=格林之心
challenges.grimm_heart_desc=在这里，死亡不是终点，只是另一种货币。\n\n-关闭等级系统，改为黑之魂机制\n-杀怪攒魂，死亡时掉落魂\n-用魂献祭可提升属性\n-每次死亡退回上一层，而不是结束游戏

#==== 15 / 20 / 29 ====
challenges.boss_guard=首领护卫
challenges.boss_guard_desc=首领身边总站着几个不好惹的。\n\n-每个 Boss 战额外生成 3 个精英护卫\n-护卫的生命、伤害、命中、闪避各 +20%

challenges.wind_up=等我启动
challenges.wind_up_desc=第一下只是试探，第二下才是认真的，第三下你会希望自己没挨过。\n\n-对同一目标的伤害递增：第一次 20%，第二次 50%，第三次及以后 110%\n-更换目标后重新计算

challenges.child_labor=雇佣童工
challenges.child_labor_desc=有些小家伙瘦得可怜，跑起来却快得吓人。\n\n-13% 的怪物生命降到 20%\n-它们的移动速度变为两倍

#==== 8 / 21 / 68 ====
challenges.chaos=混乱
challenges.chaos_desc=打中别人和被别人打中，都会让脑子变得不太清楚。\n\n-战斗命中时有 25% 概率给对方挂上一个随机状态\n-可能的状态：加速、虚弱、寒冷、隐身、致盲、祝福

challenges.spell_combo=法术连击
challenges.spell_combo_desc=法术会自己接上下一句。\n\n-施法后有 13% 概率立即再施放一次\n-不消耗充能，也不消耗回合\n-单次最多追加一次

challenges.extreme_state=极端状态
challenges.extreme_state_desc=你只剩一口气，但也只剩下杀意。\n\n-开局生命上限降到 10%（最低 10 点）\n-攻击力与命中翻倍

#==== 73 / 77 / 86 幽灵链 ====
challenges.mystic_revival=神秘复苏
challenges.mystic_revival_desc=它们一出生就已经死过一次了。\n\n-13% 的怪物一出生就是幽灵形态\n-幽灵只有 1 点生命、会飞行、不给经验

challenges.necromancer=亡灵法师
challenges.necromancer_desc=倒下的家伙没有真正离开。\n\n-怪物死亡后有 20% 概率在原地留下一个幽灵

challenges.vengeful_spirit=复仇之魂
challenges.vengeful_spirit_desc=你杀过的东西会记得你的样子。\n\n-被击杀的怪物有 10% 概率在下一层以幽灵形式复仇\n-每层最多 5 只

#==== 76 / 124 ====

challenges.wild_dog_milk=野生狗奶
challenges.wild_dog_milk_desc=不知道是什么动物的奶。\n- 使用后全属性降低 75%（攻击/命中/闪避只剩四分之一）\n- 但期间不会死亡（生命最低保留 1）\n- 永久生效（不会随时间消失）\n\n换命的道具 —— 代价是你几乎打不动任何东西。

#==== 39 / 160 / 161 / 167 ====
challenges.all_or_nothing=All or Nothing
challenges.all_or_nothing_desc=要么翻倍，要么一无所有。你只有这两种结局。\n\n-开局获得赌徒之骰\n-使用后选择一件可堆叠物品赌博\n-50% 数量翻倍，50% 数量清零

challenges.whale=氪金大佬
challenges.whale_desc=只要钱够，什么都能变得更强。\n\n-可以消耗金币给物品升级\n-费用 = 100 × (当前等级 + 1)\n-无等级上限

challenges.money_is_life=钱就是命
challenges.money_is_life_desc=金币在你身上结成了一层看不见的护甲。\n\n-受到致命伤时，用等量金币抵消伤害（1 金币抵 1 点伤害）\n-生命保留在 1

challenges.golden_dungeon=黄金地牢
challenges.golden_dungeon_desc=这里的一切都被熔成了金子。\n\n-怪物不掉落任何物品\n-地面生成的物品全部换算成金币\n-任务与剧情物品除外

#==== 33 / 38 / 42 ====
challenges.black_market=黑市
challenges.black_market_desc=柜台底下还藏着一些不摆出来的东西。\n\n-每家商店额外上架 1-2 件特殊商品\n-包括神器、法杖、稀有符石，以及本 MOD 的专属道具

challenges.loot_box=盲盒
challenges.loot_box_desc=你永远不知道盒子里是什么，这正是它的乐趣所在。\n\n-每家商店上架 2 个盲盒\n-打开后：60% 普通消耗品、30% 装备、10% 稀罕物

challenges.equivalent_exchange=等价交换
challenges.equivalent_exchange_desc=一物换一物，价值对等，种类也对等。\n\n-开局获得 3 张交换契约\n-选择一件物品，随机换成同类别中的另一件\n-等级保留

#==== 139 ====
challenges.chaos_wand=紊乱法杖
challenges.chaos_wand_desc=法杖里的力量不太听话，它想变成别的样子。\n\n-任何法杖施法时有 13% 概率变成另一种法杖的效果\n-等级沿用当前法杖\n-这不是新物品，是一条全局规则

#==== 41 / 88 ====
challenges.money_is_power=钱是万能
challenges.money_is_power_desc=在这座地牢里，金币能买到一切。\n\n-开局获得万能钱袋\n-用金币直接购买任何物品，包括药水、卷轴、装备、神器、力量药水、升级卷轴\n-与「氪金大佬」不重叠：那个是升级，这个是购买

challenges.auction_house=拍卖行
challenges.auction_house_desc=这里的东西一天一个价，全看谁在喊。\n\n-商店价格波动在 0.5~1.8 倍之间\n-每件商品首次看到时价格定格\n-每层有 35% 概率被 NPC 全场抬价 1.5 倍

#==== 144 / 151 / 164 ====
challenges.broken_authority=破碎权柄
challenges.broken_authority_desc=王权碎裂之后，它开始召唤帮手。\n\n-每个 Boss 生命降至 33% 后\n-每 5 回合召唤 1 只稀有怪（带随机精英词缀）

challenges.holy_divinity=圣明神明
challenges.holy_divinity_desc=神明借了你一部分力量，代价是每天都要还回去一点。\n\n-玩家生命、命中、闪避 +50%\n-玩家攻击 +30%\n-每 5 回合有 1 回合必须停下来祷告，那回合无法行动

challenges.magic_dungeon=魔法地牢
challenges.magic_dungeon_desc=它们也会用魔法，虽然用得很随意。\n\n-怪物有 13% 概率使用随机一种魔法\n-以法杖法术的形式表现

#==== 103 / 120 / 152 / 166 ====
challenges.bullet_hell=弹幕地狱
challenges.bullet_hell_desc=射出去的东西不再只有一发。\n\n-远程投射物变为 3 发散射：主投射物照常，另外 2 发落在相邻格\n-散射之间有间隙，可以走位躲开

challenges.error_404=404
challenges.error_404_desc=有些东西会突然不见了，包括你自己。\n\n-每回合有 0.5% 概率被直接送回主界面\n-大约 200 回合一次

challenges.peaceful_dungeon=和平地牢
challenges.peaceful_dungeon_desc=它们暂时不想动你。别搞错了这个"暂时"的意思。\n\n-所有怪物不会主动攻击你\n-直到你主动攻击任何一只怪物（违反合约）\n-违反后本层怪物属性 +50%，Boss 层改为 Boss 生命 +50%\n-每下一层重置

challenges.holy_angel=神圣天使
challenges.holy_angel_desc=当所有神圣的试炼都通过，你便不再是凡人。\n\n-集齐所有神圣类挑战后变为天使\n-祷告不再消耗回合\n-每次祷告获得 2% 护盾与 2% 回血

#==== 67 ====
challenges.mimic_threat=宝箱危机
challenges.mimic_threat_desc=有些箱子会咬人。\n\n-每层有 20% 概率生成一只宝箱怪\n-可能是普通、黑檀或黄金宝箱怪\n-藏在普通堆里或门口

#==== 100 ====
challenges.mirror_duel=镜像对决
challenges.mirror_duel_desc=走廊尽头站着一个人，和你长得一模一样。\n\n-每层有 13% 概率生成一只敌对镜像\n-它的外观、攻击、生命都跟随你\n-它只能普通攻击（没有背包，用不了道具与法杖）\n-击杀后掉落一件同等级的随机装备

#==== 63 ====
challenges.cute_rats=鼠鼠可爱
challenges.cute_rats_desc=地牢里的居民今天看起来格外可爱。\n\n-所有怪物的贴图、名字与攻击按钮图标都变成小鼠\n-Boss 除外\n-纯外观，属性与 AI 不变

#==== END(补全): 键名与旧条目不一致的挑战 ====
challenges.floor_shuffle=楼层混乱
challenges.floor_shuffle_desc=楼梯不再安分，它们会把你送到一个它自己选好的地方。\n\n-每个区域内的 4 个普通层顺序被打乱\n-Boss 层位置不变，仍然在第 5/10/15/20/25 层\n-楼层编号与游玩顺序不再对应
challenges.primal_state=原始状态
challenges.primal_state_desc=它们捡起了地上的石头。\n\n-非远程怪物在够不到你的时候会扔石头\n-最大射程 6 格\n-Boss、精英怪与本来就是远程的怪不参与
challenges.wild_milk=野生狗奶
challenges.wild_milk_desc=不知道是什么动物的奶，喝下去手脚都不听使唤了。\n\n-使用后全属性降低 75%，攻击、命中、闪避只剩四分之一\n-但期间不会死亡，生命最低保留 1\n-永久生效
challenges.equip_binding=装备绑定
challenges.equip_binding_desc=拿到手就是你的了，甩都甩不掉。\n\n-获得的装备自动绑定\n-无法丢弃、投掷或出售\n-使用驱邪卷轴可以解绑

#==== END(补全·全库扫描结果): 遗漏的挑战键 ====
#---- 挑战区（6 个）----
challenges.area_1=空洞遗迹
challenges.area_1_desc=这里是所有支线的尽头，也是魔绫最后停留的地方。\n\n-共 8 层：26F 入口、27-30F 常规层、31F 冥犬、32F 剧院、33F 四柱\n-这里的楼梯与主线机制不同，建议先清空敌人再下楼
challenges.area_3=银河深渊·火龙
challenges.area_3_desc=龙睡在自己的巢穴里，而你把门推开了。\n\n-只有 1 层\n-没有常规层，进门即战
challenges.area_4=伊比利亚·海嗣
challenges.area_4_desc=海水漫过了伊比利亚的城墙，也带来了别的东西。\n\n-共 10 层：前 4 层为第 1 章、第 5 层为海嗣首领、随后 4 层为第 2 章、第 10 层为深海首领\n-海嗣会不断增殖，注意及时清场
challenges.area_5=嘉维尔·雨林
challenges.area_5_desc=雨林里的每一片叶子后面，都可能藏着什么东西。\n\n-共 10 层：前 4 层为第 1 章、第 5 层为首领、随后 4 层为第 2 章、第 10 层为大酋长\n-雨林中遍布陷阱与召唤师
challenges.area_6=汐斯塔·海滨
challenges.area_6_desc=海滨度假地的平静只是表象。\n\n-共 10 层：前 4 层为第 1 章、第 5 层为首领、随后 4 层为第 2 章、第 10 层为最终首领
challenges.area_7=六大天王
challenges.area_7_desc=六人曾是挚友，如今却分崩离析。\n\n-共 7 层\n-第 26 层为引路人之厅，有 NPC 讲述往事\n-随后依次是法术王、不灭追猎者、疫病王、远程王、召唤王\n-第 32 层为关底的全能王\n-建议先收集 9 张笔记残页，了解他们的过去

#==== END(第二批 14 条)====
challenges.time_power=时间之力
challenges.time_power_desc=地牢深处埋着某种不属于这里的东西，它记得时间本该怎样流动。\n\n-开局获得时间沙漏\n-沙漏可以冻结时间，让你在别人静止时多走几步
challenges.time_accel=时间加速
challenges.time_accel_desc=你感觉自己的动作越来越快，快到连自己都跟不上。\n\n-整个游戏的节奏变为原来的两倍\n-战斗、移动、特效全部加快\n-怪物也行动得更快
challenges.time_god=时间之神
challenges.time_god_desc=当时间的三重权柄都握在手中，你便不再只是使用时间，而是支配它。\n\n-集齐全部时间类挑战后生效\n-每 10 回合获得 2 回合时间气泡\n-气泡期间时间静止，只有你能行动

challenges.undying=不死之身
challenges.undying_desc=它们倒在地上的样子像是死了。但地牢里的东西没那么容易死透。\n\n-怪物无法死亡\n-生命归零时改为麻痹 50 回合\n-麻痹结束后它们会站起来，而且记得你
challenges.king_of_mobs=怪物之王
challenges.king_of_mobs_desc=当所有增强都叠加在一起，地牢真正的主人终于现身了。\n\n-选择所有怪物增强类挑战后生效\n-所有怪物获得 20% 免伤

challenges.lasting_potions=药水永恒
challenges.lasting_potions_desc=这一瓶喝下去，药效久久不散。\n\n-药水持续时间 +20%
challenges.toxic_potions=是药三分毒
challenges.toxic_potions_desc=瓶子里的东西味道不太对。你早该看出来的。\n\n-喝下药水有 13% 概率中毒
challenges.one_more=再来一瓶
challenges.one_more_desc=你晃了晃瓶子，里面似乎还有一点。\n\n-喝下药水有 13% 概率不消耗这瓶药水
challenges.lucky_potion=幸运药水
challenges.lucky_potion_desc=一撮金粉沉在瓶底。喝下去，运气会站在你这边一会儿。\n\n-新增道具幸运药水\n-使用后 50 回合内，财富戒指与幸运附魔的效果 +50%\n-获取方式：财富与幸运掉落
challenges.mixed_potions=混合药水
challenges.mixed_potions_desc=所有药水都变成了同一种浑浊的颜色，闻起来像什么都有可能。\n\n-除力量药水外，刷新出来的药水全部变为紊乱药水\n-商店购买等其它途径不受影响
challenges.alchemist=炼金术士
challenges.alchemist_desc=你手比平时稳，一次能出两份。\n\n-制作秘药时有 13% 概率获得两份
challenges.potion_feast=药水盛宴
challenges.potion_feast_desc=这一层似乎格外慷慨，瓶瓶罐罐随处可见。\n\n-药水刷新率提升 20%
