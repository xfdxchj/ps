challenges.gambler=搏杀赌徒
challenges.gambler_desc=升级全靠运气。\n- 开局获得一枚 **+3 财富戒指**\n- 财富戒指有 8% 概率产出升级卷轴\n- **常规的升级卷轴投放被完全取消**\n- 与「格林之心」互斥
