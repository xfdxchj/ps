challenges.no_food=缩餐节食
challenges.no_food_desc=食物本就稀缺，但你还需要注意节食！\n\n-使用各类食物与丰饶之角的饱腹效果为原本的三分之一\n-其他恢复饥饿的机制不受影响
challenges.no_armor=信念护体
challenges.no_armor_desc=如今护甲已难堪大用，你只能相信你自己的肉身了！\n\n-布甲之外所有护甲的基本防御力降低\n-所有护甲升级提供的防御力成长大幅降低\n-灵壤守卫的防御力大幅降低
challenges.no_healing=恐药异症
challenges.no_healing_desc=治疗药剂真是种好东西，可惜你对它过敏！\n\n-治疗药剂、以治疗药剂为原料炼制的道具与阳光果将无法治愈英雄，反而会使英雄中毒\n-紊乱魔药不会随机到治愈英雄或使英雄中毒的效果\n-这些道具对其他单位依然发挥正常效果。
challenges.no_herbalism=荒芜之地
challenges.no_herbalism_desc=这个晦气的地牢里连干净的水都没有了...\n\n-移除露珠\n-移除所有特殊植物\n-高草依然会掉落种子，但种子不会生根发芽
challenges.swarm_intelligence=集群智能
challenges.swarm_intelligence_desc=要小心了，地牢里的怪物们也在学习进步！\n\n-当你被敌人发现时，附近的其他敌人也会被吸引到那里。
challenges.darkness=没入黑暗
challenges.darkness_desc=地牢毕竟是在地下嘛！\n\n-正常视野范围显著缩小\n-每层都会出现一根火把\n-其他光源有效性降至1/5
challenges.no_scrolls=禁忌咒文
challenges.no_scrolls_desc=一种卷轴会变得更稀有。不幸的是，总是最有用的那一种。\n\n-移除地牢中半数的升级卷轴
challenges.champion_enemies=精英强敌
challenges.champion_enemies_desc=道高一尺，魔高一丈！\n\n普通敌人生成时会有概率获得特殊的精英强敌效果，概率会从1层的1/8增长至21层的1/6。\n\n-精英强敌不以沉睡状态生成\n-精英强敌生成时英雄会察觉\n-精英强敌无法被转化为盟友\n\n一共有六种精英强敌效果：\n_烈焰(橙)：_近战伤害+25%，攻击时点燃，死亡时起火(不点燃水体)\n_索敌(紫)：_近战伤害+25%，近战范围+3\n_敌法(绿)：_所受伤害-50%，免疫魔法效果\n_巨型(蓝)：_所受伤害-80%，近战范围+1，无法进入门道\n_天佑(黄)：_精准、闪避x4\n_成长(红)：_精准、闪避、攻击伤害与有效生命+20%，每4回合以上属性成长1%
challenges.stronger_bosses=绝命头目
challenges.stronger_bosses_desc=这项挑战会让所有Boss都更具挑战性！\n\n_粘咕：_生命值+20%\n_-_持续处于水中时，生命回复量递增，最高至每回合3点\n_-_爆发攻击蓄力时间由2回合缩短至1回合\n_天狗：_生命+25%\n_-_第一阶段：陷阱更加致命\n_-_第二阶段：技能频率更高\n_DM-300：_生命+33%\n_-_能量塔更坚固，并且需要击毁3座\n_-_技能频率更高，威力也更强大\n_-_超载时移动速度更高\n_-_地表导线数量为原先的两倍\n_矮人国王：_生命+50%\n_-_所有阶段中都会召唤更多强力随从\n_-_第一阶段：更高的技能与召唤频率\n_-_第二阶段：每轮额外召唤两名随从\n_-_第三阶段：生命值+100%，进一步提高召唤频率\n_Yog-Dzewa：_\n_-_同时召唤两个古神之拳！\n_-_激光攻击伤害+60%\n_-_召唤更强大的随从

rankings$record.something=在黑暗中被击杀
rankings$record.won=获得Yendor护符
rankings$record.ascended=成功携带护符回到地面！
#END 便利测试挑战
challenges.convenience=便利测试包
challenges.convenience_desc=每局开局携带一小份测试便利包（金币、几颗宝石、若干杖），便于快速体验商店宝石、镶嵌与法杖蜕变。\n- 给予几颗宝石\n- 给予少量金币与示例法杖
challenges.costly_alchemy=炼金无望
challenges.costly_alchemy_desc=炼金的消耗更大了。\n- 在炼金台合成需 1.5x 炼金能量
challenges.inflation=通货膨胀
challenges.inflation_desc=市场物价陷入混乱。\n- 商店售价 +50%\n- 把东西卖给商店：所得 -50%

challenges.berserk=狂暴
challenges.berserk_desc=怪物被打疼了会更凶。\n- 怪物受击后攻击力 +20%\n- 持续 2 回合，不叠加

challenges.fragile=脆弱
challenges.fragile_desc=谁都扛不住打。\n- 玩家与怪物受到的伤害都提高 13%

challenges.glass_cannon=玻璃大炮
challenges.glass_cannon_desc=攻强守弱。\n- 玩家攻击 +20%\n- 玩家生命上限 -13%

challenges.elite_boost=精英强化
challenges.elite_boost_desc=精英怪更强了。\n- 精英怪的生命上限、伤害、命中、闪避各 +20%\n- 勾选本项即会让精英怪出现，无需再勾"精英强敌"

challenges.elite_dungeon=精英地牢
challenges.elite_dungeon_desc=这地牢里混进了不少稀有品种。\n- 13% 的怪物被替换为其**稀有变种**\n- 稀有变种包括：白化老鼠、流亡豺狼人、寄居蟹、腐蚀史莱姆、强盗、幽灵死灵法师、装甲暴徒、DM-201、资深武僧、混沌元素、酸蚀蝎\n- 稀有怪通常属性更强或掉落更好（白化老鼠必掉物品）

challenges.growing_fury=越战越勇
challenges.growing_fury_desc=怪物越残血越拼命。\n- 每损失 20% 生命，攻击 +10%\n- 最多叠加 4 层（上限 +40%）

challenges.last_stand=破釜沉舟
challenges.last_stand_desc=残血时爆发。\n- 玩家生命低于 30% 时：攻击 +30%、攻速 +20%

challenges.all_out=极致攻哈
challenges.all_out_desc=双方都全力输出。\n- 玩家与怪物的攻击各 +20%

challenges.wrath_of_dead=亡者之怒
challenges.wrath_of_dead_desc=濒死反扑。\n- 玩家生命低于 10% 时，造成的伤害翻倍

#==== 音频类挑战的台词（ChallengeSfx 用）====
endcontent.challenge.challengesfx.minister_line=首先，我是生活部部长
endcontent.challenge.challengesfx.future_line=王同学，我祝你前～程～似锦
endcontent.challenge.challengesfx.oligei_line=奥利给！
endcontent.challenge.challengesfx.nailong_line=奶龙大笑！
endcontent.challenge.challengesfx.haozihao_line=耗子尾汁！

#==== 音频类挑战（第二批）====
challenges.life_minister=生活部长
challenges.life_minister_desc=部长要来视察了。\n- 每回合 3% 概率说出"首先，我是生活部部长"并播放音效\n- 不影响行动，纯搞笑

challenges.bright_future=前程似锦
challenges.bright_future_desc=来自王同学的祝福。\n- 每回合 3% 概率停止行动，说出"王同学，我祝你前～程～似锦"

challenges.rat_tail_soup=耗子尾汁
challenges.rat_tail_soup_desc=年轻人不讲武德。\n- 每回合 3% 概率显示"耗子尾汁"并播放音效

challenges.oligei=奥利给
challenges.oligei_desc=干了兄弟们！\n- 每回合 3% 概率停止行动，喊"奥利给"\n- 同时获得 1 回合狂暴

challenges.providence=天意侵蚀
challenges.providence_desc=天意难测。\n- 每回合 3% 概率随机播放一段新三国音效

challenges.milk_dragon=奶龙大笑
challenges.milk_dragon_desc=每回合 3% 概率触发奶龙大笑

challenges.grimm_music=格林之音
challenges.grimm_music_desc=将全部常规区域与 Boss 战的 BGM 替换为格林（黑魂）主题。\n- 纯娱乐规则，不影响战斗平衡\n- 启用后，其他概率触发音效的规则仍可勾选，但其音效会被 BGM 盖过

#==== 生成数量 / 掉落类挑战（第三批）====
challenges.crowded=人口密集
challenges.crowded_desc=怪物变多了。\n- 普通怪物生成数量 +20%\n- 与"怪物浪潮"可叠加（最多 x4.8）

challenges.monster_wave=怪物浪潮
challenges.monster_wave_desc=数量压倒质量。\n- 怪物生成数量 x4\n- 普通怪物的生命与伤害变为原来的 20%\n- Boss 不受数值削弱

challenges.abundance=丰饶
challenges.abundance_desc=资源充足。\n- 资源及物品掉落 +25%

challenges.barren=贫瘠
challenges.barren_desc=资源匮乏。\n- 资源及物品掉落 -25%\n- 不会降到 0，通关所需的最少资源仍有保障

challenges.scarce_supplies=稀缺补给
challenges.scarce_supplies_desc=补给变少了。\n- 消耗品（药水 / 卷轴 / 食物 / 炸弹）生成数量 -40%

challenges.excess_supplies=过量补给
challenges.excess_supplies_desc=补给过剩。\n- 消耗品（药水 / 卷轴 / 食物 / 炸弹）生成数量 +50%

challenges.bomb_fanatic=炸弹狂魔
challenges.bomb_fanatic_desc=每到一层都想炸点什么。\n- 每层额外掉落 1 个炸弹

challenges.frieren=芙莉莲
challenges.frieren_desc=宝箱似乎变多了。\n- 宝箱数量提高约 20%

challenges.treasure_hunter=宝物猎人
challenges.treasure_hunter_desc=盯着箱子，别管那些小怪。\n- 普通怪物掉落 -30%\n- 每个宝箱额外增加 1 件物品

#==== 经济类挑战（第四批）====
challenges.bounty=赏金制度
challenges.bounty_desc=悬赏取酬。\n- 击杀精英怪额外获得 30 金币\n- 击杀 Boss 额外获得 120 金币

challenges.high_buyback=高价回收
challenges.high_buyback_desc=商人出价更公道了。\n- 把物品卖给商店所得 x1.5\n- 与"通货膨胀"互斥

challenges.destitute=一贫如洗
challenges.destitute_desc=每到一个新区域都要被盘剥一次。\n- 进入下一区域时金币 -20%

challenges.generous_merchant=慷慨商人
challenges.generous_merchant_desc=货物更全，但价格也更贵。\n- 商店商品数量 +30%\n- 商店售价 x1.25\n- 与"通货膨胀"可共存（价格会更高）

#==== ChallengeEffects 运行时提示 ====
endcontent.challenge.challengeeffects.destitute_lost=一贫如洗：进入新区域，损失 %d 金币
endcontent.challenge.challengeeffects.immovable_block=免疫

#==== 战斗 / 环境触发类挑战（第五批）====
challenges.frenzy=狂热
challenges.frenzy_desc=怪物越打越快。\n- 怪物每次攻击命中后攻速 +13%\n- 最多叠加 3 层（上限 +39%），持续 5 回合

challenges.popeye=大力水手
challenges.popeye_desc=力大但迟钝。\n- 玩家近战物理攻击 +25%\n- 玩家攻击速度 -20%

challenges.swift=风驰电掣
challenges.swift_desc=大家都变快了。\n- 玩家攻速 +20%\n- 怪物移速 +20%

challenges.bloodbath=血流成河
challenges.bloodbath_desc=刀刀见血。\n- 任何攻击命中后 13% 概率使目标流血\n- 玩家与怪物都适用

challenges.retaliation=以牙还牙
challenges.retaliation_desc=怪物会还手。\n- 玩家攻击后，怪物 13% 概率立即反击\n- 每回合每只怪最多反击一次，不消耗怪物回合

challenges.immovable=不动如山
challenges.immovable_desc=偶尔完全打不动。\n- 怪物受击时 13% 概率完全免疫该次伤害

challenges.immolation=烈火焚身
challenges.immolation_desc=挨打就着火。\n- 玩家受击时 13% 概率燃烧

challenges.frozen_world=冰天雪地
challenges.frozen_world_desc=天寒地冻。\n- 玩家每回合 3% 概率寒冷、2% 概率冰冻\n- 只影响玩家

challenges.thunderstorm=雷暴
challenges.thunderstorm_desc=天雷无眼。\n- 每回合 5% 概率闪电随机劈中一个角色（玩家或怪物）\n- 伤害 = 3 x 层数 / 5（第 25 层约 15 点），并可能点燃

challenges.college_student=大学生
challenges.college_student_desc=熬夜的代价。\n- 玩家每回合 3% 概率受到 1 点伤害\n- 不会致死（生命值至少保留 1）

challenges.giant=巨型化
challenges.giant_desc=有些怪长得特别大。\n- 13% 的怪物生命值 +50%、体型增大\n- 不影响寻路（仍能通过门道）\n- Boss 与小 Boss 不参与

challenges.flower_lover=我爱花花
challenges.flower_lover_desc=地牢里开满了花。\n- 13% 的草地被替换为随机植物\n- 纯趣味规则，不影响数值

challenges.absurd_world=荒诞世界
challenges.absurd_world_desc=你看到的不一定是真的。\n- 怪物贴图**完全随机**变化（不限于本层，任何怪物外观都可能出现）\n- 纯外观规则，属性与 AI 完全不变

#==== 扩展包易档（139-168 中的易档）====
challenges.holy_possession=神圣附体
challenges.holy_possession_desc=神恩加身。\n- 经验获取 +20%

challenges.enlightenment=醍醐灌顶
challenges.enlightenment_desc=一点就通。\n- 每个天赋层级额外获得 1 点天赋点\n- 与神圣灵感药水可叠加\n- 与"就业紧张"互斥

challenges.job_crisis=就业紧张
challenges.job_crisis_desc=英雄也得面对现实。\n- 职业天赋全部失效（所有天赋加成一并无效）\n- 与"醍醐灌顶"互斥

challenges.heirloom_ring=家传戒指
challenges.heirloom_ring_desc=祖传的宝贝。\n- 开局额外获得一枚神射戒指（已鉴定）

challenges.heirloom_armor=家传铠甲
challenges.heirloom_armor_desc=祖传的护具。\n- 开局额外获得一件板甲（已鉴定）

challenges.holy_light=神圣之光
challenges.holy_light_desc=微光护佑。\n- 每回合 3% 概率回复 2% 最大生命\n- 满血时不触发

#==== 准易档（18/22/69/121/140）+ 134 归入格林 ====
challenges.aging=老龄化
challenges.aging_desc=怪物也上了年纪。\n- 普通怪物每回合 13% 概率睡眠 1 回合\n- Boss 与精英怪免疫

challenges.overkill_reverse=物极必反
challenges.overkill_reverse_desc=打得太狠反而没用。\n- 单次伤害超过目标最大生命 150% 时，该次伤害被完全免疫\n- 只对怪物生效

challenges.nine_to_one=九九归一
challenges.nine_to_one_desc=九是极数。\n- 最终伤害为 9 的倍数时，改为 1 点\n- 玩家与怪物都适用

challenges.medieval_knight=中世纪骑士
challenges.medieval_knight_desc=重甲在身，步履维艰。\n- 玩家护甲值 +60%\n- 玩家移动速度 -50%\n- 与「信念护体」互斥

challenges.headshot=枪枪爆头
challenges.headshot_desc=拉开距离，一枪一个。\n- 与目标距离 5 格以上时，远程攻击伤害必定为最大值\n- 距离小于 5 格时正常结算

challenges.golden_mead=黄金蜂蜜酒
challenges.golden_mead_desc=格林系列物品。使用后获得「发狂」：\n- 攻击提升 50%\n- 每回合扣除最大生命值的一半（最低保留 1）\n- 与「镇魂歌」联动

#==== 60/79/17（准易档第二批）====
challenges.valentine=情人节
challenges.valentine_desc=今天是个好日子。\n- 玩家攻击命中后，13% 概率魅惑目标\n- 被魅惑的怪物会暂时停止敌对行为

challenges.heirloom_wand=家传法杖
challenges.heirloom_wand_desc=祖传的施法工具。\n- 开局额外获得 13 种进阶法杖中随机的一支（已鉴定）\n- 与「家传戒指」「家传铠甲」可同时勾选

challenges.advanced_enchant=高级附魔台
challenges.advanced_enchant_desc=每到新区域都有补给。\n- 每进入一个新区域（每 5 层）获得 1 个附魔秘卷\n- Boss 层不额外发放

endcontent.challenge.challengeeffects.enchant_region_gain=高级附魔台：获得 %d 个附魔秘卷

#==== 7 / 57 / 59 ====
challenges.skip_student=跳级生
challenges.skip_student_desc=越级而上的代价与收益。\n- 开局获得一张**跳级券**\n- 使用后直接前往下一区域的第一层\n- 跳级时获得 +2 力量、+3 升级卷轴、+4 经验药水\n- 用一次少一张

challenges.broken_equipment=残缺装备
challenges.broken_equipment_desc=有些装备天生就差一截。\n- 随机附魔时 13% 概率获得「残缺」词缀\n- 残缺装备攻击力降低 20%\n- 残缺装备无法进行装备觉醒

challenges.cursed_equipment=诅咒装备
challenges.cursed_equipment_desc=不祥的气息更浓了。\n- 装备获得诅咒的概率提高 13%\n- 原本 30%，提高后为 43%

#==== 55 / 58 ====
challenges.unstable_upgrade=不稳定强化
challenges.unstable_upgrade_desc=强化结果飘忽不定。\n- 使用升级卷轴强化时，13% 概率额外 +2 级\n- 其余情况按正常结算

challenges.random_enchant=随机附魔
challenges.random_enchant_desc=到手的装备常常带着点什么。\n- 装备（武器/护甲）获得时 50% 概率带随机附魔词缀\n- 与「装备觉醒」独立计算，可叠加

endcontent.challenge.challengeeffects.unstable_upgrade=不稳定强化：额外 +%d 级！

#==== 46 / 71 ====
challenges.unstable_potions=药剂不稳定
challenges.unstable_potions_desc=药水的效果不太对劲。\n- 饮用药水后 13% 概率追加一个随机效果\n- 效果正负各半：急速 / 隐形 / 护盾 或 中毒 / 燃烧 / 眩晕

challenges.drunk=喝大了
challenges.drunk_desc=喝断片了。\n- 每回合 3% 概率触发眩晕 3 回合

endcontent.challenge.challengeeffects.unstable_potion_haste=药剂不稳定：你突然感到身轻如燕！
endcontent.challenge.challengeeffects.unstable_potion_invisible=药剂不稳定：你的身影淡了下去。
endcontent.challenge.challengeeffects.unstable_potion_barrier=药剂不稳定：一层护盾笼罩了你。
endcontent.challenge.challengeeffects.unstable_potion_poison=药剂不稳定：你感到一阵恶心……
endcontent.challenge.challengeeffects.unstable_potion_burning=药剂不稳定：你身上着火了！
endcontent.challenge.challengeeffects.unstable_potion_paralysed=药剂不稳定：你的身体不听使唤了。
endcontent.challenge.challengeeffects.drunk_stun=你喝大了，眼前一黑。

#==== 环境类 49/52/74/141/149/162 ====
challenges.chernobyl=切尔诺贝利
challenges.chernobyl_desc=空气本身就是毒。\n- 全图铺满毒气，玩家受影响、怪物免疫\n- 开局与每层额外获得 1 瓶净化药水\n- 与「恐药异症」联动

challenges.trap_overflow=陷阱泛滥
challenges.trap_overflow_desc=地上到处都是机关。\n- 地图陷阱数量翻倍

challenges.rainforest=热带雨林
challenges.rainforest_desc=水里不太平。\n- 每一格水有 13% 概率生成食人鱼

challenges.anti_magic_zone=禁魔空间
challenges.anti_magic_zone_desc=魔法在这里被压制。\n- 所有魔法伤害降低 20%\n- 玩家与怪物都受影响\n- 与「紊乱法杖」「法术连击」「家传法杖」互斥

challenges.sticky_honey=黏糊蜂蜜
challenges.sticky_honey_desc=地牢里到处是蜂蜜。\n- 每一层额外刷新 2 只蜜蜂

challenges.realistic_dungeon=真实地牢
challenges.realistic_dungeon_desc=越深，空气越稀薄。\n- 每 50−5×(层数÷5) 回合必须停下深呼吸一次\n- 第 5 层约 45 回合，第 25 层约 25 回合\n- 最低不低于 15 回合

endcontent.challenge.challengeeffects.breath_stop=空气太稀薄了，你不得不停下来深呼吸。

#==== 159 绵羊地牢 ====
challenges.sheep_dungeon=绵羊地牢
challenges.sheep_dungeon_desc=咩咩咩。\n- 玩家周围 7×7 范围内 13% 概率生成 1~2 只绵羊\n- 触发后有 20 回合冷却\n- 绵羊无敌且不会攻击，会自行消失

#==== 49 切尔诺贝利：药水改动 ====
challenges.chernobyl.purity=净化药水（切尔诺贝利）：解除中毒，300 回合内不再中毒
challenges.chernobyl.cleanse=全面净化（切尔诺贝利）：清除所有负面效果，持续 600 回合

#==== 1 牢地碎破 ====
challenges.shattered_land=牢地碎破
challenges.shattered_land_desc=地牢的区域被打乱了。\n- **区域倒置**：1 区刷 5 区的怪、2 区刷 4 区、4 区刷 2 区、5 区刷 1 区（3 区不变）\n- 所有怪物的生命/伤害/护甲/命中/闪避按专用配置表重新配平\n- 5 区出现的原 1 区怪物额外获得移速提升与永久祝福\n- 与「极强」联动

#==== 40 / 65 / 104 ====
challenges.loan=贷款
challenges.loan_desc=向商人借钱。\n- 在商店里可以贷款金币\n- 必须在 1000 回合内偿还本金的 110%\n- 到期自动从金币里扣除，金币不够则欠着\n- 同一时间只能欠一笔

challenges.timely_rain=及时雨
challenges.timely_rain_desc=命不该绝。\n- 整局**第一次**致命伤害不会死，保留 1 点生命\n- 触发顺序在「命悬一线」之前

challenges.close_call=命悬一线
challenges.close_call_desc=生死一线间。\n- 致命伤害时有 13% 概率保留 1 点生命\n- 可重复触发\n- 与「及时雨」联动：及时雨先用掉那次必保

endcontent.challenge.challengeeffects.close_call_survive=命悬一线！你活了下来。

#==== 104 血量状态描述 ====
endcontent.challenge.challengeeffects.hp_perfect=精神抖擞
endcontent.challenge.challengeeffects.hp_good=状态尚可
endcontent.challenge.challengeeffects.hp_hurt=受了些伤
endcontent.challenge.challengeeffects.hp_bad=伤势不轻
endcontent.challenge.challengeeffects.hp_severe=伤得很重
endcontent.challenge.challengeeffects.hp_critical=命悬一线
endcontent.challenge.challengeeffects.hp_brink=只剩一口气

#==== 81 搏杀赌徒 ====
challenges.gambler=搏杀赌徒
challenges.gambler_desc=升级全靠运气。\n- 开局获得一枚 **+3 财富戒指**\n- 财富戒指有 8% 概率产出升级卷轴\n- **常规的升级卷轴投放被完全取消**\n- 与「格林之心」互斥

#==== 本批新增 8 条 ====
challenges.thief_rats=盗贼鼠群
challenges.thief_rats_desc=它们不只是咬你，还偷你钱。\n- 怪物攻击命中时 5% 概率偷走 5% 金币\n- 击杀该怪物后**双倍返还**\n- 追着打把钱拿回来

challenges.no_lower_limit=无下限术士
challenges.no_lower_limit_desc=远程对它没用。\n- 怪物受到远程攻击时，13% 概率完全免疫该次伤害\n- 与「枪枪爆头」联动

challenges.i_am_king=吾为王者
challenges.i_am_king_desc=王者的威严不容侵犯。\n- 所有 Boss 的命中与闪避提升 20%\n- 与「绝命头目」「首领护卫」联动

challenges.flying_thief=飞天神偷
challenges.flying_thief_desc=你根本看不见它。\n- 13% 的怪物获得永久隐身\n- Boss 不会隐身\n- 隐身怪物偷袭时会必定命中

challenges.demon_dungeon=恶魔地牢
challenges.demon_dungeon_desc=它们都来自另一个维度。\n- 所有怪物被视为恶魔类\n- 只改属性标记，外观与数值完全不变\n- 与「神圣之力」联动

challenges.holy_power=神圣之力
challenges.holy_power_desc=圣光灼烧邪祟。\n- 对恶魔类目标造成的伤害提升 30%\n- 与「恶魔地牢」联动时收益最大化

challenges.ancient_upgrade=古代升级
challenges.ancient_upgrade_desc=古老的技艺在你身上苏醒。\n- 每达到 3 级，伤害的下限与上限各提升 10%\n- 例如 15-20 在 3 级时变为 16-22\n- 等级越高收益越大

challenges.monster_dungeon=怪物地牢
challenges.monster_dungeon_desc=一切都是为了强化它们。\n- 所有与怪物相关的概率规则提升至至少 25%\n- 例如「盗贼鼠群」的 5% 会变成 25%

endcontent.challenge.challengeeffects.thief_rats_stolen=盗贼鼠群：它偷走了你 %d 金币！
endcontent.challenge.challengeeffects.thief_rats_refund=你把钱夺了回来，还多得了 %d 金币。
endcontent.challenge.challengeeffects.no_lower_limit_immune=无下限术士：它完全无视了这次远程攻击。

#==== 56 / 108 ====
challenges.equipment_binding=装备绑定
challenges.equipment_binding_desc=拿到手就是你的了。\n- 获得的装备（武器/护甲/戒指/法杖/神器）自动绑定\n- 无法丢弃、投掷或出售\n- 使用**驱邪卷轴**可以解绑

challenges.awakening=装备觉醒
challenges.awakening_desc=久经沙场自会开窍。\n- 武器击杀 50 只怪后觉醒\n- 护甲格挡 100 次后觉醒\n- 觉醒时获得一条随机附魔词缀\n- 每件装备只能觉醒一次\n- 残缺装备与诅咒装备无法觉醒

endcontent.challenge.challengeeffects.awakening_done=你的装备觉醒了！它获得了一条新的附魔词缀。

#==== 157 附魔扩充 ====
challenges.enchant_expansion=附魔扩充
challenges.enchant_expansion_desc=附魔池变大了。\n- 新增附魔**锋利**：近战伤害 +20%\n- 新增附魔**力量**：远程伤害 +20%\n- 两条各占随机附魔池的 20%\n- 与「随机附魔」「装备觉醒」联动

#==== 附魔名称 ====
items.weapon.enchantments.keen.name=锋利
items.weapon.enchantments.keen.desc=近战攻击伤害提升 20%。
items.weapon.enchantments.mighty.name=力量
items.weapon.enchantments.mighty.desc=远程攻击伤害提升 20%。

#==== 地图类 3/4/5/6/150/154 ====
challenges.region_shift=区域错位
challenges.region_shift_desc=每个区域都沾了点邻居的味道。\n- 地图生态向相邻区域偏移\n- 生成内容会混入邻区的风格

challenges.elite_migration=精英迁徙
challenges.elite_migration_desc=精英不再安分。\n- 取消精英怪的楼层限制\n- 原本只在自己区域出现的精英怪，现在任何楼层都可能出现\n- 与「精英强化」「精英地牢」联动

challenges.monster_invasion=怪物入侵
challenges.monster_invasion_desc=别的区域的东西跑过来了。\n- 每层额外混入 2 只其它区域的普通怪\n- 混入的怪也会参与稀有变种替换

challenges.full_dungeon=完整地牢
challenges.full_dungeon_desc=这趟旅程还长着呢。\n- 每个区域的常规层由 4 层增至 **9 层**\n- Boss 层位置不变（每 10 层一个）\n- 主线由 25 层加长为 **50 层**

challenges.flooded_dungeon=淹没地牢
challenges.flooded_dungeon_desc=脚下全是水。\n- 每一层都是**水域生态**（整层被水淹没）\n- 水中 20% 概率生成幻影食人鱼\n- 与「废弃地牢」互斥

challenges.abandoned_dungeon=废弃地牢
challenges.abandoned_dungeon_desc=大自然接管了这里。\n- 每一层都是**草木生态**（整层长满植被）\n- 踩踏植物时 3% 概率被缠绕 3 回合\n- 与「淹没地牢」互斥

challenges.region_shift=区域错位

#==== 格林系列 125/133/136 ====
challenges.grimm_weapon=格林之器
challenges.grimm_weapon_desc=来自另一个童话的兵器。\n- 开局获得**银色短铳**：出手不消耗回合（CD 10 回合）\n- 开局获得**兔子怀表**：把短铳的冷却归零（自身 CD 10 回合）

challenges.grimm_weapon_2=格林之器2
challenges.grimm_weapon_2_desc=双剑会自己记住挥动的节奏。\n- 开局获得**神天使双剑**\n- 每攻击一次，攻击次数 +1，最多 7 次\n- 每次造成 60% 伤害\n- 切换楼层时计数清零

challenges.grimm_weapon_3=格林之器3
challenges.grimm_weapon_3_desc=怨恨与勇气，两把剑。\n- 开局获得**怨恨之剑**：生命越低伤害越高，1 血时跃升到 3 倍\n- 开局获得**勇剑**：三段循环 —— 3 连击（60%）/ 必中 / 4 连击（60%）

#==== 格林装备名称 ====
items.silvergun.name=银色短铳
items.rabbitwatch.name=兔子的怀表
items.hatesword.name=怨恨之剑
items.bravesword.name=勇剑
items.angelsword.name=神天使双剑

#==== 129 心爱的少女 ====
challenges.beloved_girl=心爱的少女
challenges.beloved_girl_desc=有个故事被撕成了九片。\n- 每 **2 层**刷新一枚童话残片（每层最多一枚）\n- 残片共 **9 种**，对应九位少女\n- **3 枚不同的残片**炼成 1 张童话残页\n- **3 张残页**炼成《心爱的少女》\n- 使用后会被带到某个不该存在的地方

#==== 127 / 128 / 134 ====
challenges.grimm_ring=格林之戒
challenges.grimm_ring_desc=时间对佩戴者格外宽容。\n- 增加戒指**黑兔戒指**\n- 每回合第一次命中后返还一个回合\n- 表现为一回合可以攻击两次\n- **无法升级**

challenges.grimm_art=格林之术
challenges.grimm_art_desc=把判决往后推三个回合。\n- 增加道具**镇魂歌**\n- 使用后获得 3 回合不死（生命到 0 也不死）\n- **状态结束时若已欠下死亡，仍会死去**

challenges.golden_mead=黄金蜂蜜酒
challenges.golden_mead_desc=给不想活了的人准备的。\n- 使用后获得**发狂**\n- 攻击力 **+50%**\n- **每回合扣除最大生命的一半**（最低保留 1 点）\n- 与「镇魂歌」联动

endcontent.grimm.goldenmead.ac_drink=饮用
endcontent.grimm.soulrequiem.ac_use=使用

#==== 131 格林之敌 ====
challenges.grimm_enemy=格林之敌
challenges.grimm_enemy_desc=作者走进了自己的故事。\n- 最终 Boss「古神」替换为**莉耶芙**\n- 贴图、名字、战斗对话、图鉴介绍全部替换\n- **纯外观与文本**，数值与机制完全不变\n\n莉耶芙没有对应的童话 —— 她是篡改童话的主凶，玛丽·苏。

#==== 999 层 / 爱丽丝领域 ====
levels.alicerealm.region_name=爱丽丝领域
endcontent.grimm.alice.return=书页合上了。
endcontent.grimm.alice.ring=爱丽丝把一枚黑色的戒指放进了你手里。
endcontent.grimm.alice.ring_dupe=你已经有那枚戒指了。爱丽丝把它化作了一点别的东西。
endcontent.grimm.belovedgirl.teleport=书页翻动的声音。你被带往了某个不该存在的地方。

#==== 132 黑暗之魂 ====
challenges.dark_soul=黑暗之魂
challenges.dark_soul_desc=你捡到的，就是让你来到这里的那个东西。\n- **古神护符替换为「爱丽丝」**\n- 贴图、名字、说明文本全部替换\n- 它不再是一件神器，而**是一本书**\n\n**限制**：需要 125~131 全部勾选后才生效。

#==== 126 格林之心 ====
challenges.grimm_heart=格林之心
challenges.grimm_heart_desc=等级已经没有意义了。\n- **关闭等级系统**（不再获得经验）\n- 击杀怪物获得**黑之魂**（数量 = 怪物的经验值）\n- **死亡**时额外获得一笔魂，并**退回上一层**（不是游戏结束）\n- 使用**魂之容器**献祭 10 点魂，随机提升一项属性\n\n成长不再来自升级，而来自你死过多少次。

#==== 15 / 20 / 29 ====
challenges.boss_guard=首领护卫
challenges.boss_guard_desc=王座之前，站着三个人。\n- 每个 Boss 战**额外生成 3 个精英护卫**\n- 护卫拥有随机精英能力（烈焰/投射/反魔/巨型/祝福/成长）\n- 它们的生命、伤害、命中、闪避各 +20%

challenges.wind_up=等我启动
challenges.wind_up_desc=第一下很轻，第二下也不重 —— 但别让它打到第三下。\n- 对**同一目标**：第一次伤害 **20%**，第二次 **50%**\n- 第三次及以后：**110%**\n- **换目标**就重新从第一次算起

challenges.child_labor=雇佣童工
challenges.child_labor_desc=它们又小又快。\n- 13% 的怪物**生命降到 20%**\n- 但**移速 ×2**\n- Boss 不参与

#==== 8 / 21 / 68 ====
challenges.chaos=混乱
challenges.chaos_desc=战况失控了。\n- 命中时 **25% 概率**给**被打的一方**挂一个随机 buff\n- 可能是加速、虚弱、寒冷、隐身、致盲或祝福\n- 玩家与怪物**同样会中招**

challenges.spell_combo=法术连击
challenges.spell_combo_desc=法术会自己接上下一句。\n- 施法后 **13% 概率立即再施放一次**\n- **不消耗充能、不消耗回合**\n- 单次最多追加一次

challenges.extreme_state=极端状态
challenges.extreme_state_desc=你只剩一口气，但也只剩杀意。\n- 开局生命上限降到 **10%**（最低 10 点）\n- **攻击力翻倍**\n- **命中翻倍**\n- 与「命悬一线」兼容

#==== 73 / 77 / 86 幽灵链 ====
challenges.mystic_revival=神秘复苏
challenges.mystic_revival_desc=有些东西一出生就不是活的。\n- **13%** 的怪物一生成就是**幽灵**\n- 幽灵只有 1 点生命、会飞行、击杀不给经验\n- Boss 与小 Boss 不参与

challenges.necromancer=亡灵法师
challenges.necromancer_desc=尸体不会安静地躺着。\n- 怪物死亡后 **20%** 在原地留下一个**幽灵**\n- Boss 与小 Boss 不参与\n- 与「神秘复苏」「复仇之魂」联动

challenges.vengeful_spirit=复仇之魂
challenges.vengeful_spirit_desc=它记住了是谁杀了它。\n- 被击杀的怪物 **10%** 概率在**下一层**以幽灵形式出现\n- 每层最多 5 只\n- 与「神秘复苏」「亡灵法师」联动

#==== 76 / 124 ====
challenges.primitive_state=原始状态
challenges.primitive_state_desc=它们捡起了地上的石头。\n- **非远程**怪物在打不到你时会**扔石头**\n- 最大射程 6 格\n- Boss、小 Boss 与本来就是远程的怪不参与

challenges.wild_dog_milk=野生狗奶
challenges.wild_dog_milk_desc=不知道是什么动物的奶。\n- 使用后**全属性降低 75%**（攻击/命中/闪避只剩四分之一）\n- 但期间**不会死亡**（生命最低保留 1）\n- **永久生效**（不会随时间消失）\n\n换命的道具 —— 代价是你几乎打不动任何东西。

#==== 39 / 160 / 161 / 167 ====
challenges.all_or_nothing=All or Nothing
challenges.all_or_nothing_desc=要么翻倍，要么归零。\n- 开局获得**赌徒之骰**\n- 使用后选择一件**可堆叠**物品赌博\n- **50% 数量翻倍**\n- **50% 数量清零**\n- 只能赌数量 ≥ 2 的可堆叠物品

challenges.whale=氪金大佬
challenges.whale_desc=钱能解决的问题都不是问题。\n- 可以**消耗金币给物品升级**\n- 费用 = **100 × (当前等级 + 1)**\n- **没有等级上限**，钱够就能一直升\n- 费用随等级线性增长：100 × (当前等级 + 1)

challenges.money_is_life=钱就是命
challenges.money_is_life_desc=钱真的能买命。\n- 受到**致命伤**时，用**等量金币**抵消（1 金币抵 1 点伤害）\n- 生命保留在 1 点\n- 金币不够就只能认命

challenges.golden_dungeon=黄金地牢
challenges.golden_dungeon_desc=这里只剩下黄金。\n- 怪物**不掉落任何物品**\n- 地面生成的物品**全部换算成金币**\n- 任务与剧情物品除外\n\n需要先勾选「钱是万能」。

#==== 33 / 38 / 42 ====
challenges.black_market=黑市
challenges.black_market_desc=这家店有点不对劲。\n- 每家商店**额外上架 1-2 件特殊商品**\n- 可能开出神器、法杖、稀有符石\n- 也可能出现本 MOD 的专属道具（魂之容器 / 赌徒之骰 / 野生狗奶 / 镇魂歌）

challenges.loot_box=盲盒
challenges.loot_box_desc=买之前不知道里面是什么。\n- 每家商店上架 **2 个盲盒**\n- 打开后随机：**60%** 普通消耗品 / **30%** 装备 / **10%** 稀罕物\n- 期望上是赚的，但方差很大

challenges.equivalent_exchange=等价交换
challenges.equivalent_exchange_desc=签名处还空着。\n- 开局获得 **3 张交换契约**\n- 选择一件物品，随机换成**同类别**的另一件\n- **等级保留**（+3 的武器换来的也是 +3）\n- 种子、食物等没有同类别的物品无法交换

#==== 139 ====
challenges.chaos_wand=紊乱法杖
challenges.chaos_wand_desc=杖身扭了一下。\n- **任何**法杖施法时，**13%** 概率变成**另一种法杖**的效果\n- 等级沿用当前法杖（不会白亏升级）\n- 与「法术连击」联动时，两发可能完全不同

#==== 41 / 88 ====
challenges.money_is_power=钱是万能
challenges.money_is_power_desc=钱能解决的问题，都不是问题。\n- 开局获得**万能钱袋**\n- 使用后打开采购窗口，用金币直接买**任何物品**\n- 药水 80G / 卷轴 80G / 武器护甲 200G / 法杖戒指 250G / 神器 400G\n- 力量药水 500G / 升级卷轴 600G / 经验药水 400G\n\n与「氪金大佬」不重叠 —— 那条是升级，这条是购买。

challenges.auction_house=拍卖行
challenges.auction_house_desc=价格是谈出来的。\n- 商店物品价格**波动 0.5~1.8 倍**\n- 每件商品在**首次看到时**定格（不会结算时变价）\n- 每层 **35%** 概率被 NPC 全场抬价 **×1.5**\n\n所以逛店是有意义的 —— 换个楼层可能就是另一个价。

#==== 144 / 151 / 164 ====
challenges.broken_authority=破碎权柄
challenges.broken_authority_desc=王座裂了。\n- 每个 Boss 生命**降至 33%** 后进入破碎阶段\n- **每 5 回合召唤 1 只稀有怪**（带随机精英词缀）\n- 召唤出现在 Boss 周围的空位

challenges.holy_divinity=圣明神明
challenges.holy_divinity_desc=光在你身上，但你必须不断祈祷。\n- **生命 +50%**\n- **命中 +50%**\n- **闪避 +50%**\n- **攻击 +30%**\n- 但每回合有 **25%** 概率必须停下来祷告（本回合无法行动）

challenges.magic_dungeon=魔法地牢
challenges.magic_dungeon_desc=它们也学会了魔法。\n- 怪物有 **13%** 概率使用**随机一种魔法**\n- 魔法以法杖法术的形式表现\n- 射程 4 格内才会施放

#==== 103 / 120 / 152 / 166 ====
challenges.bullet_hell=弹幕地狱
challenges.bullet_hell_desc=躲不完了。\n- 远程投射物变为 **3 发散射**\n- 主投射物照常命中\n- 另外 2 发落在**相邻格**，伤害减半\n- 有间隙可走位 —— 站在格与格之间能躲开

challenges.error_404=404
challenges.error_404_desc=这一回合不存在。\n- **每回合 0.5%** 概率被直接送回主界面\n- 期望约 **200 回合**触发一次\n- 也就是大概两三层会遇到一回\n\n随时可能发生 —— 没有安全的地方。

challenges.peaceful_dungeon=和平地牢
challenges.peaceful_dungeon_desc=它们不会先动手。\n- 所有怪物**不会主动攻击你**（但仍在走动）\n- 一旦你**主动攻击任何怪物**，合约作废\n- 违约后本层怪物**属性 +50%**（Boss 层为 Boss **生命 +50%**）\n- **每下一层重置** —— 你可以重新"和解"

challenges.holy_angel=神圣天使
challenges.holy_angel_desc=集齐所有神圣，你就不再是人。\n- 需要同时勾选「神圣附体」「圣明神明」「神圣之力」「神圣天使」\n- 变身后**祷告 CD +4**\n- 每次祷告获得 **2% 护盾 + 2% 回血**

#==== 67 ====
challenges.mimic_threat=宝箱危机
challenges.mimic_threat_desc=那个箱子在呼吸。\n- 每层 **20%** 概率生成一只**宝箱怪**\n- 三种类型随机：普通 / **黑檀**（近乎隐形）/ **黄金**\n- 优先藏在普通物品堆下，其次门口，最后出口\n\n开箱前先看一眼。

#==== 100 ====
challenges.mirror_duel=镜像对决
challenges.mirror_duel_desc=镜子里走出来的那个，想取代你。\n- 每层 **13%** 概率生成一只**敌对镜像**\n- **外观**跟随你的护甲等级\n- **攻击**跟随你的武器（打七折）\n- **生命**为你上限的一半（10~120）\n- 它**只能普通攻击** —— 没有背包，用不了道具和法杖\n- 击杀后掉落一件**同等级的随机装备**

#==== 63 ====
challenges.cute_rats=鼠鼠可爱
challenges.cute_rats_desc=它们都变小了，而且变得很多。\n- 所有怪物的**贴图**变成**小鼠**\n- 所有怪物的**名字**显示为"小鼠"\n- 攻击按钮上的**图标**也是小鼠\n- 纯外观 —— 属性、AI、掉落**完全不变**\n- Boss 与小 Boss 除外
