challenges.life_minister=Minister of life
challenges.life_minister_desc=The minister is coming to inspect.\n- Each turn, 3% chance to lose your action announcing "First of all, I am the Minister of Life."

challenges.bright_future=Bright future
challenges.bright_future_desc=A blessing from classmate Wang.\n- Each turn, 3% chance to lose your action saying "Classmate Wang, I wish you a bright future!"

challenges.rat_tail_soup=Rat tail soup
challenges.rat_tail_soup_desc=The young man has no sense of martial ethics.\n- Each turn, 3% chance to show "hao zi wei zhi" and play a sound

challenges.oligei=Oligei
challenges.oligei_desc=Let's go, brothers!\n- Each turn, 3% chance to lose your action shouting "Oligei!"\n- Also grants 1 turn of rage

challenges.providence=Providence
challenges.providence_desc=Fate is fickle.\n- Each turn, 13% chance to play a random sound clip

challenges.milk_dragon=Milk dragon laughs
challenges.milk_dragon_desc=Each turn, 3% chance to trigger the milk dragon's laugh

challenges.grimm_music=Grimm music
challenges.grimm_music_desc=Replaces all regular area and boss music with Grimm (Dark Souls) themed tracks.\n- Purely cosmetic, does not affect balance\n- Other sound-triggering rules can still be enabled, but their sounds may be drowned out by the music

#==== Spawn / drop challenges (batch 3) ====
challenges.crowded=Crowded
challenges.crowded_desc=More monsters than usual.\n- Regular enemies spawn 20% more often\n- Stacks with Monster wave (up to x4.8)

challenges.monster_wave=Monster wave
challenges.monster_wave_desc=Quantity over quality.\n- Four times as many monsters spawn\n- Regular monsters have only 20% of their normal health and damage\n- Bosses are not weakened

challenges.abundance=Abundance
challenges.abundance_desc=Plenty of resources.\n- Item drops increased by 25%

challenges.barren=Barren
challenges.barren_desc=Resources are scarce.\n- Item drops reduced by 25%\n- Never drops to zero, so a run always remains possible

challenges.scarce_supplies=Scarce supplies
challenges.scarce_supplies_desc=Fewer supplies around.\n- Consumables (potions, scrolls, food, bombs) spawn 40% less often

challenges.excess_supplies=Excess supplies
challenges.excess_supplies_desc=Supplies in abundance.\n- Consumables (potions, scrolls, food, bombs) spawn 50% more often

challenges.bomb_fanatic=Bomb fanatic
challenges.bomb_fanatic_desc=Always in the mood to blow something up.\n- One extra bomb drops on every floor

challenges.frieren=Frieren
challenges.frieren_desc=Chests seem more common.\n- About 20% more chests

challenges.treasure_hunter=Treasure hunter
challenges.treasure_hunter_desc=Ignore the small fry, watch the chests.\n- Regular monster drops reduced by 30%\n- Every chest contains one extra item

#==== Economy challenges (batch 4) ====
challenges.bounty=Bounty
challenges.bounty_desc=Paid per kill.\n- Slaying a champion enemy grants 30 extra gold\n- Slaying a boss grants 120 extra gold

challenges.high_buyback=High buyback
challenges.high_buyback_desc=The shopkeeper pays a fairer price.\n- Selling items to a shop earns 1.5x as much\n- Exclusive with Inflation

challenges.destitute=Destitute
challenges.destitute_desc=Taxed at every new region.\n- Losing 20% of your gold when entering a new region

challenges.generous_merchant=Generous merchant
challenges.generous_merchant_desc=Better stock, higher prices.\n- Shops carry 30% more items\n- Shop prices are 1.25x higher\n- Can be combined with Inflation (prices get even higher)

#==== ChallengeEffects runtime messages ====
endcontent.challenge.challengeeffects.destitute_lost=Destitute: lost %d gold entering the new region
endcontent.challenge.challengeeffects.immovable_block=IMMUNE

#==== Combat / environment trigger challenges (batch 5) ====
challenges.frenzy=Frenzy
challenges.frenzy_desc=Monsters speed up as they fight.\n- Each time a monster lands a hit it gains +13% attack speed\n- Stacks up to 3 times (+39% max), lasts 5 turns

challenges.popeye=Popeye
challenges.popeye_desc=Strong but slow.\n- Hero's melee physical damage +25%\n- Hero's attack speed -20%

challenges.swift=Swift
challenges.swift_desc=Everyone moves faster.\n- Hero attack speed +20%\n- Monster movement speed +20%

challenges.bloodbath=Bloodbath
challenges.bloodbath_desc=Every hit draws blood.\n- Any hit has a 13% chance to inflict bleeding\n- Applies to both the hero and monsters

challenges.retaliation=Retaliation
challenges.retaliation_desc=Monsters hit back.\n- After the hero attacks, monsters have a 13% chance to strike back immediately\n- At most once per monster per turn, and it costs the monster no turn

challenges.immovable=Immovable
challenges.immovable_desc=Sometimes nothing gets through.\n- Monsters have a 13% chance to completely ignore a hit

challenges.immolation=Immolation
challenges.immolation_desc=Catch fire when struck.\n- The hero has a 13% chance to start burning when damaged

challenges.frozen_world=Frozen world
challenges.frozen_world_desc=Bitter cold.\n- Each turn the hero has a 13% chance to be chilled and a 2% chance to be frozen\n- Affects the hero only

challenges.thunderstorm=Thunderstorm
challenges.thunderstorm_desc=Lightning is blind.\n- Each turn a 5% chance for lightning to strike a random character (hero or monster)\n- Damage = 3 x depth / 5 (about 15 at depth 25), and it may ignite

challenges.college_student=College student
challenges.college_student_desc=The price of all-nighters.\n- Each turn the hero has a 3% chance to take 1 damage\n- This can never be fatal (health stays at 1 or above)

challenges.giant=Giant
challenges.giant_desc=Some monsters grow unusually large.\n- 13% of monsters gain +50% health and a larger body\n- Does not affect pathing (they can still use doors)\n- Bosses and minibosses are excluded

challenges.flower_lover=Flower lover
challenges.flower_lover_desc=The dungeon is in bloom.\n- 13% of grass tiles are replaced with random plants\n- Purely cosmetic, does not affect balance

challenges.absurd_world=Absurd world
challenges.absurd_world_desc=What you see is not what you get.\n- Monster sprites are randomised\n- Purely cosmetic, stats and AI are completely unchanged

#==== Expansion easy-tier (from 139-168) ====
challenges.holy_possession=Holy possession
challenges.holy_possession_desc=Graced by the divine.\n- Experience gained increased by 20%

challenges.enlightenment=Enlightenment
challenges.enlightenment_desc=It just clicks.\n- Gain 1 extra talent point per talent tier\n- Stacks with the potion of divine inspiration\n- Exclusive with Job crisis

challenges.job_crisis=Job crisis
challenges.job_crisis_desc=Even heroes face reality.\n- All class talents stop working entirely\n- Exclusive with Enlightenment

challenges.heirloom_ring=Heirloom ring
challenges.heirloom_ring_desc=A family treasure.\n- Start each run with a ring of sharpshooting (identified)

challenges.heirloom_armor=Heirloom armor
challenges.heirloom_armor_desc=Ancestral protection.\n- Start each run with plate armor (identified)

challenges.holy_light=Holy light
challenges.holy_light_desc=A gentle glow.\n- Each turn a 13% chance to heal 2% of max health\n- Does not trigger at full health
