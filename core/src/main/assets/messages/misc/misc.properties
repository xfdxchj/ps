challenges.life_minister=Minister of life
challenges.life_minister_desc=The minister is coming to inspect.\n- Each turn, 3% chance to announce "First of all, I am the Minister of Life." with a sound clip\n- No action is lost; purely comedic

challenges.bright_future=Bright future
challenges.bright_future_desc=A blessing from classmate Wang.\n- Each turn, 3% chance to lose your action saying "Classmate Wang, I wish you a bright future!"

challenges.rat_tail_soup=Rat tail soup
challenges.rat_tail_soup_desc=The young man has no sense of martial ethics.\n- Each turn, 3% chance to show "hao zi wei zhi" and play a sound

challenges.oligei=Oligei
challenges.oligei_desc=Let's go, brothers!\n- Each turn, 3% chance to lose your action shouting "Oligei!"\n- Also grants 1 turn of rage

challenges.providence=Providence
challenges.providence_desc=Fate is fickle.\n- Each turn, 3% chance to play a random sound clip

challenges.milk_dragon=Milk dragon laughs
challenges.milk_dragon_desc=Each turn, 3% chance to trigger the milk dragon's laugh

challenges.grimm_music=Grimm music
challenges.grimm_music_desc=Replaces all regular area and boss music with Grimm (Dark Souls) themed tracks.\n- Purely cosmetic, does not affect balance\n- Other sound-triggering rules can still be enabled, but their sounds may be drowned out by the music

#==== Spawn / drop challenges (batch 3) ====
challenges.crowded=Crowded
challenges.crowded_desc=More monsters than usual.\n- Regular enemies spawn 20% more often\n- Stacks with Monster wave (up to x4.8)

challenges.monster_wave=Monster wave
challenges.monster_wave_desc=Quantity over quality.\n- Four times as many monsters spawn\n- Regular monsters have only 20% of their normal health and damage\n- Bosses are not weakened

challenges.abundance=Abundance
challenges.abundance_desc=Plenty of resources.\n- Item drops increased by 25%

challenges.barren=Barren
challenges.barren_desc=Resources are scarce.\n- Item drops reduced by 25%\n- Never drops to zero, so a run always remains possible

challenges.scarce_supplies=Scarce supplies
challenges.scarce_supplies_desc=Fewer supplies around.\n- Consumables (potions, scrolls, food, bombs) spawn 40% less often

challenges.excess_supplies=Excess supplies
challenges.excess_supplies_desc=Supplies in abundance.\n- Consumables (potions, scrolls, food, bombs) spawn 50% more often

challenges.bomb_fanatic=Bomb fanatic
challenges.bomb_fanatic_desc=Always in the mood to blow something up.\n- One extra bomb drops on every floor

challenges.frieren=Frieren
challenges.frieren_desc=Chests seem more common.\n- About 20% more chests

challenges.treasure_hunter=Treasure hunter
challenges.treasure_hunter_desc=Ignore the small fry, watch the chests.\n- Regular monster drops reduced by 30%\n- Every chest contains one extra item

#==== Economy challenges (batch 4) ====
challenges.bounty=Bounty
challenges.bounty_desc=Paid per kill.\n- Slaying a champion enemy grants 30 extra gold\n- Slaying a boss grants 120 extra gold

challenges.high_buyback=High buyback
challenges.high_buyback_desc=The shopkeeper pays a fairer price.\n- Selling items to a shop earns 1.5x as much\n- Exclusive with Inflation

challenges.destitute=Destitute
challenges.destitute_desc=Taxed at every new region.\n- Losing 20% of your gold when entering a new region

challenges.generous_merchant=Generous merchant
challenges.generous_merchant_desc=Better stock, higher prices.\n- Shops carry 30% more items\n- Shop prices are 1.25x higher\n- Can be combined with Inflation (prices get even higher)

#==== ChallengeEffects runtime messages ====
endcontent.challenge.challengeeffects.destitute_lost=Destitute: lost %d gold entering the new region
endcontent.challenge.challengeeffects.immovable_block=IMMUNE

#==== Combat / environment trigger challenges (batch 5) ====
challenges.frenzy=Frenzy
challenges.frenzy_desc=Monsters speed up as they fight.\n- Each time a monster lands a hit it gains +13% attack speed\n- Stacks up to 3 times (+39% max), lasts 5 turns

challenges.popeye=Popeye
challenges.popeye_desc=Strong but slow.\n- Hero's melee physical damage +25%\n- Hero's attack speed -20%

challenges.swift=Swift
challenges.swift_desc=Everyone moves faster.\n- Hero attack speed +20%\n- Monster movement speed +20%

challenges.bloodbath=Bloodbath
challenges.bloodbath_desc=Every hit draws blood.\n- Any hit has a 13% chance to inflict bleeding\n- Applies to both the hero and monsters

challenges.retaliation=Retaliation
challenges.retaliation_desc=Monsters hit back.\n- After the hero attacks, monsters have a 13% chance to strike back immediately\n- At most once per monster per turn, and it costs the monster no turn

challenges.immovable=Immovable
challenges.immovable_desc=Sometimes nothing gets through.\n- Monsters have a 13% chance to completely ignore a hit

challenges.immolation=Immolation
challenges.immolation_desc=Catch fire when struck.\n- The hero has a 13% chance to start burning when damaged

challenges.frozen_world=Frozen world
challenges.frozen_world_desc=Bitter cold.\n- Each turn the hero has a 3% chance to be chilled and a 2% chance to be frozen\n- Affects the hero only

challenges.thunderstorm=Thunderstorm
challenges.thunderstorm_desc=Lightning is blind.\n- Each turn a 5% chance for lightning to strike a random character (hero or monster)\n- Damage = 3 x depth / 5 (about 15 at depth 25), and it may ignite

challenges.college_student=College student
challenges.college_student_desc=The price of all-nighters.\n- Each turn the hero has a 3% chance to take 1 damage\n- This can never be fatal (health stays at 1 or above)

challenges.giant=Giant
challenges.giant_desc=Some monsters grow unusually large.\n- 13% of monsters gain +50% health and a larger body\n- Does not affect pathing (they can still use doors)\n- Bosses and minibosses are excluded

challenges.flower_lover=Flower lover
challenges.flower_lover_desc=The dungeon is in bloom.\n- 13% of grass tiles are replaced with random plants\n- Purely cosmetic, does not affect balance

challenges.absurd_world=Absurd world
challenges.absurd_world_desc=What you see is not what you get.\n- Monster sprites are **fully randomised** (not limited to the current depth - any monster's look can appear)\n- Purely cosmetic, stats and AI are completely unchanged

#==== Expansion easy-tier (from 139-168) ====
challenges.holy_possession=Holy possession
challenges.holy_possession_desc=Graced by the divine.\n- Experience gained increased by 20%

challenges.enlightenment=Enlightenment
challenges.enlightenment_desc=It just clicks.\n- Gain 1 extra talent point per talent tier\n- Stacks with the potion of divine inspiration\n- Exclusive with Job crisis

challenges.job_crisis=Job crisis
challenges.job_crisis_desc=Even heroes face reality.\n- All class talents stop working entirely\n- Exclusive with Enlightenment

challenges.heirloom_ring=Heirloom ring
challenges.heirloom_ring_desc=A family treasure.\n- Start each run with a ring of sharpshooting (identified)

challenges.heirloom_armor=Heirloom armor
challenges.heirloom_armor_desc=Ancestral protection.\n- Start each run with plate armor (identified)

challenges.holy_light=Holy light
challenges.holy_light_desc=A gentle glow.\n- Each turn a 3% chance to heal 2% of max health\n- Does not trigger at full health

#==== Near-easy tier (18/22/69/121/140) + 134 moved to Grimm ====
challenges.aging=Aging
challenges.aging_desc=Even monsters get old.\n- Regular monsters have a 13% chance per turn to sleep for 1 turn\n- Bosses and champions are immune

challenges.overkill_reverse=Overkill reversal
challenges.overkill_reverse_desc=Hitting too hard is pointless.\n- A single hit exceeding 150% of the target's max health is completely ignored\n- Only applies to monsters

challenges.nine_to_one=Nine to one
challenges.nine_to_one_desc=Nine is the ultimate number.\n- Final damage that is a multiple of 9 is reduced to 1\n- Applies to both the hero and monsters

challenges.medieval_knight=Medieval knight
challenges.medieval_knight_desc=Heavy armor, heavy steps.\n- Hero armor value +60%\n- Hero movement speed -50%\n- Exclusive with Faith is my armor

challenges.headshot=Headshot
challenges.headshot_desc=Keep your distance.\n- At 5 or more tiles away, ranged attacks always deal maximum damage\n- Normal rolls at closer range

challenges.golden_mead=Golden mead
challenges.golden_mead_desc=A Grimm-series item. Drinking it grants Frenzy:\n- +50% attack\n- Lose half of max health each turn (never below 1)\n- Synergy with Requiem

#==== Near-easy tier batch 2 ====
challenges.valentine=Valentine
challenges.valentine_desc=It is a good day for love.\n- 13% chance to charm the target after the hero lands a hit\n- Charmed monsters temporarily stop acting hostile

challenges.heirloom_wand=Heirloom wand
challenges.heirloom_wand_desc=An ancestral casting tool.\n- Start each run with a random one of the 13 evolved wands (identified)\n- Can be combined with Heirloom ring and Heirloom armor

challenges.advanced_enchant=Advanced enchanting
challenges.advanced_enchant_desc=Supplies at every new region.\n- Gain 1 arcane styli per new region (every 5 floors)\n- Not granted on boss floors

endcontent.challenge.challengeeffects.enchant_region_gain=Advanced enchanting: gained %d arcane styli

#==== 7 / 57 / 59 ====
challenges.skip_student=Skip student
challenges.skip_student_desc=Leap ahead, at a price and for a prize.\n- Start each run with a **Skip Ticket**\n- Using it takes you straight to the first floor of the next region\n- Skipping grants +2 Strength, +3 Scrolls of Upgrade and +4 Potions of Experience\n- Each ticket is single-use

challenges.broken_equipment=Broken equipment
challenges.broken_equipment_desc=Some gear is just made worse.\n- 13% chance to roll the Flawed enchantment when randomly enchanted\n- Flawed gear deals 20% less damage\n- Flawed gear cannot be awakened

challenges.cursed_equipment=Cursed equipment
challenges.cursed_equipment_desc=An even stronger whiff of ill fortune.\n- Chance for gear to be cursed is increased by 13%\n- From 30% to 43%

#==== 55 / 58 ====
challenges.unstable_upgrade=Unstable upgrade
challenges.unstable_upgrade_desc=Upgrades are a gamble.\n- 13% chance for a scroll of upgrade to grant +2 extra levels\n- Otherwise resolved normally

challenges.random_enchant=Random enchant
challenges.random_enchant_desc=New gear often comes with something.\n- Weapons and armor have a 50% chance to roll a random enchantment on pickup\n- Calculated independently of Equipment awakening, so they stack

endcontent.challenge.challengeeffects.unstable_upgrade=Unstable upgrade: +%d extra levels!

#==== 46 / 71 ====
challenges.unstable_potions=Unstable potions
challenges.unstable_potions_desc=Something is off about these potions.\n- 13% chance to add a random effect after drinking a potion\n- Effects are half good, half bad: haste / invisibility / barrier, or poison / burning / paralysis

challenges.drunk=Blackout drunk
challenges.drunk_desc=You drank too much.\n- 3% chance per turn to be paralysed for 3 turns

endcontent.challenge.challengeeffects.unstable_potion_haste=Unstable potion: you suddenly feel light on your feet!
endcontent.challenge.challengeeffects.unstable_potion_invisible=Unstable potion: your outline fades away.
endcontent.challenge.challengeeffects.unstable_potion_barrier=Unstable potion: a barrier settles around you.
endcontent.challenge.challengeeffects.unstable_potion_poison=Unstable potion: you feel sick...
endcontent.challenge.challengeeffects.unstable_potion_burning=Unstable potion: you burst into flames!
endcontent.challenge.challengeeffects.unstable_potion_paralysed=Unstable potion: your body will not obey you.
endcontent.challenge.challengeeffects.drunk_stun=You black out for a moment.

#==== Environment 49/52/74/141/149/162 ====
challenges.chernobyl=Chernobyl
challenges.chernobyl_desc=The air itself is poison.\n- The whole floor is filled with toxic gas; the hero is affected, monsters are immune\n- Gain 1 potion of purity at the start and on every floor\n- Synergy with Potion allergy

challenges.trap_overflow=Trap overflow
challenges.trap_overflow_desc=Mechanisms everywhere.\n- The number of traps on the map is doubled

challenges.rainforest=Rainforest
challenges.rainforest_desc=The water is not safe.\n- Each water tile has a 13% chance to spawn a piranha

challenges.anti_magic_zone=Anti-magic zone
challenges.anti_magic_zone_desc=Magic is suppressed here.\n- All magic damage is reduced by 20%\n- Applies to both the hero and monsters\n- Exclusive with Chaos wand, Spell combo and Heirloom wand

challenges.sticky_honey=Sticky honey
challenges.sticky_honey_desc=Honey everywhere.\n- 2 extra bees spawn on every floor

challenges.realistic_dungeon=Realistic dungeon
challenges.realistic_dungeon_desc=The deeper you go, the thinner the air.\n- Every 50-5x(depth/5) turns you must stop and take a deep breath\n- About 45 turns at depth 5, about 25 at depth 25\n- Never shorter than 15 turns

endcontent.challenge.challengeeffects.breath_stop=The air is too thin - you have to stop and breathe.

#==== 159 Sheep dungeon ====
challenges.sheep_dungeon=Sheep dungeon
challenges.sheep_dungeon_desc=Baa. Baa.\n- 13% chance to spawn 1-2 sheep within 7x7 tiles of the hero\n- 20 turn cooldown after each spawn\n- Sheep are invulnerable, harmless, and fade away on their own

#==== 49 Chernobyl potion changes ====
challenges.chernobyl.purity=Potion of purity (Chernobyl): cures poison, immune to poison for 300 turns
challenges.chernobyl.cleanse=Potion of cleansing (Chernobyl): removes all debuffs for 600 turns

#==== 1 Crumbling dungeon ====
challenges.shattered_land=Crumbling dungeon
challenges.shattered_land_desc=The dungeon's regions have been scrambled.\n- **Region inversion**: region 1 spawns region 5 monsters, region 2 spawns region 4, region 4 spawns region 2, region 5 spawns region 1 (region 3 unchanged)\n- All monster HP / damage / armor / accuracy / evasion rebalanced from a dedicated table\n- Region-1 monsters appearing in region 5 gain extra speed and a permanent blessing\n- Synergy with Extreme

#==== 40 / 65 / 104 ====
challenges.loan=Loan
challenges.loan_desc=Borrow from the merchant.\n- Gold can be borrowed at shops\n- You must repay 110% of the principal within 1000 turns\n- Repaid automatically from your gold; if you cannot pay, the debt stays\n- Only one loan at a time

challenges.timely_rain=Timely rain
challenges.timely_rain_desc=Not your time yet.\n- The **first** fatal blow of the run leaves you at 1 HP\n- Resolves before Close call

challenges.close_call=Close call
challenges.close_call_desc=A hair's breadth from death.\n- 13% chance for a fatal blow to leave you at 1 HP\n- Can trigger repeatedly\n- Synergy with Timely rain, which is used up first

endcontent.challenge.challengeeffects.close_call_survive=Close call! You survived.

#==== 104 HP state descriptions ====
endcontent.challenge.challengeeffects.hp_perfect=In fine shape
endcontent.challenge.challengeeffects.hp_good=Doing okay
endcontent.challenge.challengeeffects.hp_hurt=Wounded
endcontent.challenge.challengeeffects.hp_bad=Badly hurt
endcontent.challenge.challengeeffects.hp_severe=Severely wounded
endcontent.challenge.challengeeffects.hp_critical=Close to death
endcontent.challenge.challengeeffects.hp_brink=One breath left

#==== 81 Gambler ====
challenges.gambler=Gambler
challenges.gambler_desc=Upgrades are all down to luck.\n- Start each run with a **+3 ring of wealth**\n- The ring has an 8% chance to produce a scroll of upgrade\n- **Regular scroll of upgrade drops are removed entirely**\n- Exclusive with Grimm heart

#==== New batch of 8 ====
challenges.thief_rats=Thief rats
challenges.thief_rats_desc=They do not just bite, they rob you.\n- Monsters have a 5% chance on hit to steal 5% of your gold\n- Killing that monster refunds **double** the stolen amount\n- Chase it down to get your gold back

challenges.no_lower_limit=No lower limit
challenges.no_lower_limit_desc=Ranged attacks mean nothing to it.\n- Monsters have a 13% chance to completely ignore a ranged hit\n- Synergy with Headshot

challenges.i_am_king=I am king
challenges.i_am_king_desc=The king's authority is absolute.\n- All bosses gain +20% accuracy and evasion\n- Synergy with Badder bosses and Boss guard

challenges.flying_thief=Flying thief
challenges.flying_thief_desc=You cannot even see it.\n- 13% of monsters are permanently invisible\n- Bosses never turn invisible\n- Invisible monsters always hit when they ambush you

challenges.demon_dungeon=Demon dungeon
challenges.demon_dungeon_desc=They all come from another dimension.\n- Every monster counts as demonic\n- Only the property flag changes; looks and stats are untouched\n- Synergy with Holy power

challenges.holy_power=Holy power
challenges.holy_power_desc=Holy light sears the unholy.\n- +30% damage against demonic targets\n- Maximised when combined with Demon dungeon

challenges.ancient_upgrade=Ancient upgrade
challenges.ancient_upgrade_desc=Ancient craft awakens within you.\n- Every 3 levels, damage min and max both increase by 10%\n- For example 15-20 becomes 16-22 at level 3\n- Scales better the higher your level

challenges.monster_dungeon=Monster dungeon
challenges.monster_dungeon_desc=Everything serves to empower them.\n- All monster-related chances are raised to at least 25%\n- For example Thief rats goes from 5% to 25%

endcontent.challenge.challengeeffects.thief_rats_stolen=Thief rats: it stole %d of your gold!
endcontent.challenge.challengeeffects.thief_rats_refund=You took it back, plus %d extra gold.
endcontent.challenge.challengeeffects.no_lower_limit_immune=No lower limit: it completely ignored the ranged attack.

#==== 56 / 108 ====
challenges.equipment_binding=Equipment binding
challenges.equipment_binding_desc=Once it is yours, it stays yours.\n- Weapons, armor, rings, wands and artifacts bind on pickup\n- They cannot be dropped, thrown or sold\n- A **scroll of remove curse** unbinds them

challenges.awakening=Equipment awakening
challenges.awakening_desc=Battle teaches even steel.\n- A weapon awakens after 50 kills\n- Armor awakens after 100 blocks\n- Awakening grants a random enchantment\n- Each piece can only awaken once\n- Flawed and cursed gear can never awaken

endcontent.challenge.challengeeffects.awakening_done=Your equipment awakens! It gains a new enchantment.

#==== 157 Enchant expansion ====
challenges.enchant_expansion=Enchant expansion
challenges.enchant_expansion_desc=The enchantment pool grows.\n- New enchantment **Keen**: +20% melee damage\n- New enchantment **Mighty**: +20% ranged damage\n- Each takes a 20% share of the random enchant pool\n- Synergy with Random enchant and Equipment awakening

#==== Enchantment names ====
items.weapon.enchantments.keen.name=Keen
items.weapon.enchantments.keen.desc=Melee attacks deal 20% more damage.
items.weapon.enchantments.mighty.name=Mighty
items.weapon.enchantments.mighty.desc=Ranged attacks deal 20% more damage.

#==== Map rules 3/4/5/6/150/154 ====
challenges.region_shift=Region shift
challenges.region_shift_desc=Every region borrows from its neighbours.\n- Map ecology shifts toward an adjacent region\n- Generated content mixes in the neighbour's style

challenges.elite_migration=Elite migration
challenges.elite_migration_desc=Champions no longer stay put.\n- Floor restrictions on champions are removed\n- Champions that used to appear only in their own region can now appear anywhere\n- Synergy with Elite boost and Elite dungeon

challenges.monster_invasion=Monster invasion
challenges.monster_invasion_desc=Things from elsewhere have arrived.\n- 2 extra monsters from other regions spawn on each floor\n- Invaders can also be swapped for rare variants

challenges.full_dungeon=Full dungeon
challenges.full_dungeon_desc=This journey is a long one.\n- Each region grows from 4 to **9** regular floors\n- Boss floor positions are unchanged (one every 10 floors)\n- The main path grows from 25 to **50** floors

challenges.flooded_dungeon=Flooded dungeon
challenges.flooded_dungeon_desc=Water everywhere.\n- Every floor uses the **water** ecology (the whole level is flooded)\n- 20% chance for a phantom piranha to spawn in water\n- Exclusive with Abandoned dungeon

challenges.abandoned_dungeon=Abandoned dungeon
challenges.abandoned_dungeon_desc=Nature took over.\n- Every floor uses the **grass** ecology (the whole level is overgrown)\n- 3% chance to be entangled for 3 turns when stepping on a plant\n- Exclusive with Flooded dungeon

#==== Grimm series 125/133/136 ====
challenges.grimm_weapon=Grimm weapon
challenges.grimm_weapon_desc=Armaments from another fairy tale.\n- Start with the **Silver gun**: shots cost no turn (10 turn cooldown)\n- Start with the **Rabbit watch**: resets the gun's cooldown (own cooldown 10 turns)

challenges.grimm_weapon_2=Grimm weapon 2
challenges.grimm_weapon_2_desc=The twin blades remember their own rhythm.\n- Start with the **Angel sword**\n- Each attack adds one hit, up to 7 hits\n- Each hit deals 60% damage\n- The counter resets when you change floors

challenges.grimm_weapon_3=Grimm weapon 3
challenges.grimm_weapon_3_desc=Hatred and courage, two blades.\n- Start with the **Hate sword**: lower health means more damage, jumping to 3x at 1 HP\n- Start with the **Brave sword**: a three-stage cycle - 3 hits (60%) / guaranteed hit / 4 hits (60%)

#==== Grimm equipment names ====
items.silvergun.name=Silver gun
items.rabbitwatch.name=Rabbit watch
items.hatesword.name=Hate sword
items.bravesword.name=Brave sword
items.angelsword.name=Angel sword

#==== 129 Beloved girl ====
challenges.beloved_girl=Beloved girl
challenges.beloved_girl_desc=A story torn into nine pieces.\n- One fairy fragment spawns every **2 floors** (at most one per floor)\n- There are **9 kinds**, one per maiden\n- **3 different fragments** brew into 1 fairy note\n- **3 fairy notes** brew into the Beloved girl\n- Using it takes you somewhere that should not exist

#==== 127 / 128 / 134 ====
challenges.grimm_ring=Grimm ring
challenges.grimm_ring_desc=Time is kinder to the wearer.\n- Adds the **Rabbit ring**\n- The first hit each turn refunds your turn\n- In practice you attack twice per turn\n- **Cannot be upgraded**

challenges.grimm_art=Grimm art
challenges.grimm_art_desc=Pushes the verdict back three turns.\n- Adds the **Soul requiem**\n- Grants 3 turns of undeath (you survive at 0 HP)\n- **When it ends, a death already owed is still paid**

challenges.golden_mead=Golden mead
challenges.golden_mead_desc=For those who no longer want to live.\n- Drinking grants **Madness**\n- Attack power **+50%**\n- **Each turn drains half your maximum health** (never below 1)\n- Synergy with Soul requiem

endcontent.grimm.goldenmead.ac_drink=Drink
endcontent.grimm.soulrequiem.ac_use=Use

#==== 131 Grimm enemy ====
challenges.grimm_enemy=Grimm enemy
challenges.grimm_enemy_desc=The author walks into her own story.\n- The final boss "Yog-Dzewa" becomes **Liefu**\n- Sprite, name, battle dialogue and bestiary text all replaced\n- **Purely cosmetic and textual** - stats and mechanics are untouched\n\nLiefu has no fairy tale of her own - she is Mary Sue, the one who rewrites them.

#==== 999F / Alice realm ====
levels.alicerealm.region_name=Alice's realm
endcontent.grimm.alice.return=The book closes.
endcontent.grimm.alice.ring=Alice places a black ring in your hand.
endcontent.grimm.alice.ring_dupe=You already carry that ring. Alice turns it into something else.
endcontent.grimm.belovedgirl.teleport=The sound of turning pages. You are taken somewhere that should not exist.

#==== 132 Dark soul ====
challenges.dark_soul=Dark soul
challenges.dark_soul_desc=What you picked up is what brought you here.\n- The **Amulet of Yendor becomes "Alice"**\n- Sprite, name and description are all replaced\n- It is no longer an artifact - **it is a book**\n\n**Requires** 125-131 to all be enabled.

#==== 126 Grimm heart ====
challenges.grimm_heart=Grimm heart
challenges.grimm_heart_desc=Levels no longer mean anything.\n- **The level system is disabled** (no experience is gained)\n- Killing monsters grants **black souls** (equal to their EXP value)\n- **Death** grants extra souls and sends you **one floor up** (it is not a game over)\n- Use the **Soul vessel** to sacrifice 10 souls for a random stat boost\n\nGrowth no longer comes from levelling, but from how many times you have died.

#==== 15 / 20 / 29 ====
challenges.boss_guard=Boss guard
challenges.boss_guard_desc=Three figures stand before the throne.\n- Each boss fight spawns **3 extra elite guards**\n- Guards carry a random champion ability (blazing/projecting/anti-magic/giant/blessed/growing)\n- Their health, damage, accuracy and evasion are each +20%

challenges.wind_up=Wind up
challenges.wind_up_desc=The first hit is light, the second is not much better - but do not let it land a third.\n- Against the **same target**: first hit deals **20%**, second **50%**\n- Third hit onwards: **110%**\n- **Switching targets** resets the count

challenges.child_labor=Child labor
challenges.child_labor_desc=Small and fast.\n- 13% of monsters have their **health cut to 20%**\n- But their **movement speed is doubled**\n- Bosses are unaffected

#==== 8 / 21 / 68 ====
challenges.chaos=Chaos
challenges.chaos_desc=The fight has slipped out of control.\n- On hit, **25% chance** to apply a random buff to the **defender**\n- Could be haste, weakness, chill, invisibility, blindness or blessing\n- Players and monsters are affected **equally**\n\nchallenges.spell_combo=Spell combo\nchallenges.spell_combo_desc=Spells finish each other's sentences.\n- After casting, **13% chance to cast again immediately**\n- Costs **no charge and no turn**\n- At most one extra cast per spell\n\nchallenges.extreme_state=Extreme state\nchallenges.extreme_state_desc=One breath left, and nothing but killing intent.\n- Starting max health is cut to **10%** (minimum 10)\n- **Attack power is doubled**\n- **Accuracy is doubled**\n- Compatible with Close call

#==== 73 / 77 / 86 wraith chain ====
challenges.mystic_revival=Mystic revival
challenges.mystic_revival_desc=Some things are never alive to begin with.\n- **13%** of monsters spawn as **wraiths**\n- Wraiths have 1 HP, fly, and grant no experience\n- Bosses and minibosses are unaffected

challenges.necromancer=Necromancer
challenges.necromancer_desc=The dead do not lie still.\n- **20%** of monsters leave a **wraith** behind when they die\n- Bosses and minibosses are unaffected\n- Synergy with Mystic revival and Vengeful soul

challenges.vengeful_spirit=Vengeful soul
challenges.vengeful_spirit_desc=It remembers who killed it.\n- **10%** of slain monsters return as a wraith on the **next floor**\n- At most 5 per floor\n- Synergy with Mystic revival and Necromancer

#==== 76 / 124 ====
challenges.primitive_state=Primitive state
challenges.primitive_state_desc=They picked up rocks.\n- **Non-ranged** monsters **throw rocks** when they cannot reach you\n- Maximum range 6 tiles\n- Bosses, minibosses and naturally ranged monsters are unaffected

challenges.wild_dog_milk=Wild dog milk
challenges.wild_dog_milk_desc=No idea what animal this came from.\n- Drinking it cuts **all stats by 75%** (attack/accuracy/evasion drop to a quarter)\n- But you **cannot die** while it lasts (health never drops below 1)\n- **Permanent** (never expires)\n\nA life-swap item - the cost is that you can barely hurt anything.

#==== 39 / 160 / 161 / 167 ====
challenges.all_or_nothing=All or Nothing
challenges.all_or_nothing_desc=Double it, or lose it all.\n- Start with the **Gambler''s dice**\n- Use it to gamble a **stackable** item\n- **50% chance to double the quantity**\n- **50% chance to lose it all**\n- Only stacks of 2 or more can be gambled

challenges.whale=Whale
challenges.whale_desc=Anything money can solve is not a problem.\n- **Spend gold to upgrade items**\n- Cost = **100 x (current level + 1)**\n- **No level cap** - keep upgrading as long as you can pay\n- Cost grows linearly: 100 x (current level + 1)

challenges.money_is_life=Money is life
challenges.money_is_life_desc=Money really can buy life.\n- A **fatal blow** is offset by spending **an equal amount of gold** (1 gold per point)\n- Your health stays at 1\n- If you cannot afford it, you die

challenges.golden_dungeon=Golden dungeon
challenges.golden_dungeon_desc=Only gold remains here.\n- Monsters **drop no items at all**\n- Items generated on the ground are **all converted into gold**\n- Quest and story items are excluded\n\nRequires Money is power.

#==== 33 / 38 / 42 ====
challenges.black_market=Black market
challenges.black_market_desc=Something is off about this shop.\n- Each shop stocks **1-2 extra special items**\n- Could be artifacts, wands, rare runestones\n- Or this mod''s own items (soul vessel / gambler''s dice / wild dog milk / soul requiem)

challenges.loot_box=Loot box
challenges.loot_box_desc=You do not know what is inside until you open it.\n- Each shop stocks **2 loot boxes**\n- On opening: **60%** common consumable / **30%** equipment / **10%** rare\n- Profitable on average, but high variance

challenges.equivalent_exchange=Equivalent exchange
challenges.equivalent_exchange_desc=The signature line is still blank.\n- Start with **3 exchange contracts**\n- Pick an item and get a random item of the **same category**\n- **Level is preserved** (a +3 weapon yields another +3)\n- Seeds and food have no equivalent category and cannot be exchanged

#==== 139 ====
challenges.chaos_wand=Chaos wand
challenges.chaos_wand_desc=The wand twists in your hand.\n- **Any** wand has a **13%** chance to cast a **different wand's** effect\n- Level is inherited from your current wand\n- With Spell combo, the two casts can be completely different

#==== 41 / 88 ====
challenges.money_is_power=Money is power
challenges.money_is_power_desc=Anything money can solve is not a problem.\n- Start with the **almighty purse**\n- Use it to open a purchase window and buy **any item** with gold\n- Potions 80G / scrolls 80G / weapons and armor 200G / wands and rings 250G / artifacts 400G\n- Potion of strength 500G / scroll of upgrade 600G / potion of experience 400G\n\nDoes not overlap with Whale - that one upgrades, this one buys.

challenges.auction_house=Auction house
challenges.auction_house_desc=Prices are negotiated.\n- Shop prices **vary from 0.5x to 1.8x**\n- Each item is locked in the **first time you see it** (no surprise at checkout)\n- Each floor has a **35%** chance of an NPC **1.5x** bid-up on everything\n\nSo browsing is worthwhile - a different floor may mean a different price.

#==== 144 / 151 / 164 ====
challenges.broken_authority=Broken authority
challenges.broken_authority_desc=The throne has cracked.\n- Every boss enters a broken phase below **33% health**\n- **Summons a rare monster every 5 turns** (with a random champion affix)\n- Summons appear in free tiles around the boss

challenges.holy_divinity=Holy divinity
challenges.holy_divinity_desc=The light is upon you, but you must keep praying.\n- **+50% health**\n- **+50% accuracy**\n- **+50% evasion**\n- **+30% attack**\n- But **one turn in five** must be spent praying

challenges.magic_dungeon=Magic dungeon
challenges.magic_dungeon_desc=They have learned magic too.\n- Monsters have a **13%** chance to use a **random spell**\n- Spells are represented by wand effects\n- Only cast within 4 tiles

#==== 103 / 120 / 152 / 166 ====
challenges.bullet_hell=Bullet hell
challenges.bullet_hell_desc=No way to dodge them all.\n- Ranged projectiles become a **3-shot spread**\n- The main projectile hits as usual\n- The other 2 land on **adjacent tiles** at half damage\n- Gaps remain - standing between tiles lets you dodge

challenges.error_404=404
challenges.error_404_desc=This turn does not exist.\n- **0.5% chance every turn** of being sent straight back to the main menu\n- Expect it roughly once every **200 turns**\n- That is about once every two or three floors\n\nIt can happen at any moment - nowhere is safe.

challenges.peaceful_dungeon=Peaceful dungeon
challenges.peaceful_dungeon_desc=They will not strike first.\n- All monsters **will not attack you** (but still wander)\n- The pact breaks the moment **you attack any monster**\n- Once broken, monsters gain **+50% stats** this floor (bosses gain **+50% health**)\n- **Resets every floor** - you can make peace again

challenges.holy_angel=Holy angel
challenges.holy_angel_desc=Gather every holy rite and you stop being human.\n- Requires Holy possession, Holy divinity, Holy power and Holy angel together\n- In angel form, **prayer cooldown +4**\n- Each prayer grants **2% shield + 2% healing**

#==== 67 ====
challenges.mimic_threat=Mimic threat
challenges.mimic_threat_desc=That chest is breathing.\n- Each floor has a **20%** chance to spawn a **mimic**\n- One of three types at random: common / **ebony** (nearly invisible) / **golden**\n- Hidden under item piles first, then doors, then the exit\n\nLook before you open.

#==== 100 ====
challenges.mirror_duel=Mirror duel
challenges.mirror_duel_desc=The one that stepped out of the mirror wants to replace you.\n- Each floor has a **13%** chance to spawn a **hostile mirror**\n- Its **appearance** follows your armor tier\n- Its **attack** follows your weapon (at 70%)\n- Its **health** is half of your max (10-120)\n- It can **only make basic attacks** - no inventory, no items, no wands\n- Killing it drops a **random equipment of the same level**

#==== 63 ====
challenges.cute_rats=Cute rats
challenges.cute_rats_desc=They all got smaller, and there are so many of them.\n- Every monster's **sprite** becomes a **rat**\n- Every monster's **name** reads "rat"\n- The **attack button icon** is a rat too\n- Purely cosmetic - stats, AI and drops are **completely unchanged**\n- Bosses and minibosses are excluded

#==== END(fill): challenge keys that did not match the old naming ====
challenges.floor_shuffle=Floor shuffle
challenges.floor_shuffle_desc=The stairs are no longer well behaved.\n\nThe 20 normal floors are shuffled (floor 1 stays fixed, bosses stay at interval positions).\n\nSynergy with Region shift, Elite migration and Monster invasion.
challenges.primal_state=Primitive state
challenges.primal_state_desc=They picked up rocks.\n- **Non-ranged** monsters **throw rocks** when they cannot reach you\n- Maximum range 6 tiles\n- Bosses, minibosses and naturally ranged monsters are unaffected
challenges.wild_milk=Wild dog milk
challenges.wild_milk_desc=No idea what animal this came from.\n- Cuts **all stats by 75%**\n- But you **cannot die** while it lasts (health never drops below 1)\n- **Permanent**
challenges.equip_binding=Equipment binding
challenges.equip_binding_desc=Once on, it does not come off.\n- Equipping **binds** the item - it cannot be removed or dropped\n- A **scroll of remove curse** unbinds it

#==== END(fill, full-scan results): missing challenge keys ====
challenges.spell_combo=Spell combo
challenges.spell_combo_desc=Spells finish each other's sentences.\n- After casting, **13% chance to cast again immediately**\n- Costs **no charge and no turn**\n- At most one extra cast per spell

challenges.extreme_state=Extreme state
challenges.extreme_state_desc=One breath left, and nothing but killing intent.\n- Starting max health is cut to **10%** (minimum 10)\n- **Attack power is doubled**\n- **Accuracy is doubled**\n- Compatible with Close call

#---- challenge areas (6) ----
challenges.area_1=Hollow ruins
challenges.area_1_desc=The final land of Mary. 8 floors: entrance, 4 normal floors, the hound, the theatre, the four pillars.
challenges.area_3=Galaxy abyss - fire dragon
challenges.area_3_desc=A single floor: fight the fire dragon in its lair. No normal floors, the fight starts at the door.
challenges.area_4=Iberia - seaborn
challenges.area_4_desc=Arknights: Iberia. The seaborn keep multiplying - clear them out.
challenges.area_5=Gavial - rainforest
challenges.area_5_desc=Arknights: Gavial. The rainforest is full of traps and summoners.
challenges.area_6=Siesta - seaside
challenges.area_6_desc=Arknights: Siesta. The calm of this resort town is only skin deep.
challenges.area_7=Six kings
challenges.area_7_desc=Six friends, now torn apart. 7 floors: the guide hall, then the kings of magic, the hunt, plague, range, summons and finally the all-rounder.

#==== END(batch 2, 14 rules) ====
challenges.time_power=Power of time
challenges.time_power_desc=Start with the **hourglass of time**, an item that bends the flow of time.
challenges.time_accel=Time acceleration
challenges.time_accel_desc=**Game animation speed is doubled.**\n- Combat, movement and effects all run faster\n- Monsters also act faster\n- Saves time, but details are easier to miss
challenges.time_reverse=Time reversal
challenges.time_reverse_desc=Start with the **time reversal** item.\n- Use it to **save a snapshot** of your current state\n- Use it again to **return to that snapshot**\n- One snapshot per floor
challenges.time_god=God of time
challenges.time_god_desc=With every time challenge enabled:\n- **Every 10 turns you gain 2 turns of time bubble**\n- Time stands still inside it - only you can act

challenges.undying=Undying
challenges.undying_desc=They do not die, they only sleep.\n- **Monsters cannot die**\n- At zero health they are **paralysed for 50 turns**\n\nThey will wake up, and they will remember you.
challenges.empowered_mobs=Empowered monsters
challenges.empowered_mobs_desc=Some things got bigger.\n- **13%** of monsters are **50% larger**\n- Their **health is also 50% higher**
challenges.king_of_mobs=King of monsters
challenges.king_of_mobs_desc=With every monster-enhancing challenge enabled:\n- **All monsters gain 20% damage reduction**

challenges.lasting_potions=Lasting potions
challenges.lasting_potions_desc=**Potion duration +20%.**
challenges.toxic_potions=Toxic potions
challenges.toxic_potions_desc=Drinking a potion has a **13%** chance to **poison** you.
challenges.one_more=One more bottle
challenges.one_more_desc=Drinking a potion has a **13%** chance to **not consume** it.
challenges.lucky_potion=Lucky potion
challenges.lucky_potion_desc=Adds the **lucky potion**:\n- For **50 turns** after drinking\n- Ring of wealth and lucky enchantment effects are **+50%**\n- Obtained from wealth/luck drops
challenges.mixed_potions=Mixed potions
challenges.mixed_potions_desc=Tastes a bit off.\n- Apart from strength potions, **every generated potion becomes a chaos potion**\n- Shop purchases and other routes are unaffected
challenges.alchemist=Alchemist
challenges.alchemist_desc=**13%** chance to **brew two** elixirs instead of one.
challenges.potion_feast=Potion feast
challenges.potion_feast_desc=**Potion generation rate +20%.**
