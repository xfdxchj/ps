challenges.no_food=On diet
challenges.no_food_desc=Food's already scarce, but you have to watch your portions as well!\n\n- Food and the horn of plenty are one third as effective at satisfying hunger\n- Other sources of satiety are unaffected
challenges.no_armor=Faith is my armor
challenges.no_armor_desc=You'll need faith in yourself, as your armor won't do much!\n\n- Base blocking power reduced for all armor except cloth\n- All armor now gains very little blocking when upgraded\n- Earthen guardian's defensive power is also significantly reduced
challenges.no_healing=Pharmacophobia
challenges.no_healing_desc=Healing potions sure are handy, unfortunately you're allergic!\n\n- Potions of healing, items that use potions of healing in their recipe, and sunfruit will poison the hero instead of healing them\n- Unstable brews cannot randomly poison or heal the hero\n- These items still work normally for other characters.
challenges.no_herbalism=Barren land
challenges.no_herbalism_desc=There seems to be no clean water left in this accursed dungeon...\n\n- Dew drops are removed\n- Plants are removed\n- Seeds still appear, but will not take root
challenges.swarm_intelligence=Swarm intelligence
challenges.swarm_intelligence_desc=Watch out, the dungeon monsters are getting smarter!\n\n- When an enemy notices you, nearby enemies are drawn to that location
challenges.darkness=Into darkness
challenges.darkness_desc=It is a dungeon after all!\n\n- Regular visible distance dramatically reduced\n- A torch appears on each floor\n- Other light sources are 1/5 as effective
challenges.no_scrolls=Forbidden runes
challenges.no_scrolls_desc=A certain rune is harder to find. Unfortunately, it's always the most useful one.\n\n- Half of the dungeon's upgrade scrolls are removed
challenges.champion_enemies=Hostile champions
challenges.champion_enemies_desc=You're not the only one who can level up!\n\nRegular enemies have a 1/8 chance to spawn with a special champion buff on floor 1, scaling up to 1/6 on floor 21.\n\n- Champions wake up if they spawn asleep\n- The hero knows when a champion spawns\n- Champions cannot be turned into allies\n\nThere are six types of champion enemy:\n_Blazing (orange):_ +25% melee damage, ignites on hit, spreads flames on death, can't ignite water tiles\n_Projecting (purple):_ +25% melee damage, +3 melee range\n_Antimagic (green):_ -50% damage taken, immune to magical effects\n_Giant (blue):_ -80% damage taken, +1 melee range, cannot move into tunnels\n_Blessed (yellow):_ 4x accuracy and evasion\n_Growing (red):_ +20% accuracy, evasion, damage, and effective HP. Increases by 1% every 4 turns.
challenges.stronger_bosses=Badder bosses
challenges.stronger_bosses_desc=Bosses are much tougher with this challenge!\n\n_Goo:_ +20% health\n_-_ Healing in water ramps up, to 3/turn\n_-_ Pumps up in 1 turn instead of 2\n_Tengu:_ +25% health\n_-_ Phase 1: traps are much deadlier\n_-_ Phase 2: abilities are more frequent\n_DM-300:_ +33% health\n_-_ Pylons are tougher and 3 activate\n_-_ Abilities are more powerful and frequent\n_-_ DM-300 is faster when supercharged\n_-_ Exposed wires are twice as common\n_Dwarf King:_ +50% health\n_-_ Minions are stronger in all phases\n_-_ Phase 1: faster abilities and summons\n_-_ Phase 2: 2 more minions per round\n_-_ Phase 3: 2x health, faster summons\n_Yog-Dzewa:_\n_-_ Two fists are summoned at a time!\n_-_ +60% laser damage\n_-_ Stronger minions

rankings$record.something=Killed by Something
rankings$record.won=Obtained the Amulet of Yendor
rankings$record.ascended=Ascended with the Amulet!
#END convenience test challenge
challenges.convenience=Convenience test pack
challenges.convenience_desc=Start each run with a small test convenience pack (gold, a few gems, sample wands) so you can quickly try shops, gem-inlay and wand evolutions.\n- Gives a few gems\n- Gives starter gold and sample wands
challenges.costly_alchemy=Harsh Alchemy
challenges.costly_alchemy_desc=Crafting demands more of your alchemical energy.\n- Brewing recipes cost 1.5x energy
challenges.inflation=Inflation
challenges.inflation_desc=The marketplace economy has gone haywire.\n- Shops sell items for +50% more gold\n- Selling items to a shop gives you -50% gold

challenges.berserk=Berserk
challenges.berserk_desc=Battered monsters hit back harder.\n- Monsters gain +20% attack after taking damage\n- Lasts 2 turns, does not stack

challenges.fragile=Fragile
challenges.fragile_desc=Nobody can take a hit.\n- Both the hero and monsters take 13% more damage

challenges.glass_cannon=Glass cannon
challenges.glass_cannon_desc=All offense, no defense.\n- Hero deals +20% damage\n- Hero's max health is 13% lower

challenges.elite_boost=Elite boost
challenges.elite_boost_desc=Champions are meaner.\n- Champion enemies gain +20% max health, damage, accuracy and evasion\n- Enabling this rule also makes champions appear, without needing Hostile champions

challenges.elite_dungeon=Elite dungeon
challenges.elite_dungeon_desc=Rare breeds are mixed in with the usual rabble.\n- 13% of monsters are replaced by their _rare variant_\n- Rare variants include: Albino Rat, Gnoll Exile, Hermit Crab, Caustic Slime, Bandit, Spectral Necromancer, Armored Brute, DM-201, Senior Monk, Chaos Elemental, Acidic Scorpio\n- Rare monsters usually have stronger stats or better drops (the albino rat always drops loot)

challenges.growing_fury=Growing fury
challenges.growing_fury_desc=Wounded monsters fight harder.\n- Monsters gain +10% attack for every 20% health lost\n- Stacks up to 4 times (+40% max)

challenges.last_stand=Last stand
challenges.last_stand_desc=A burst of power when cornered.\n- While below 30% health the hero gains +30% attack and +20% attack speed

challenges.all_out=All out
challenges.all_out_desc=Everyone hits harder.\n- Both the hero and monsters deal +20% damage

challenges.wrath_of_dead=Wrath of the dead
challenges.wrath_of_dead_desc=Deadly when nearly dead.\n- While below 10% health the hero deals double damage

